---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

on:
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    actions: read
    pull-requests: read

jobs:
    security-secrets:
        uses: arillso/.github/.github/workflows/security-secrets.yml@2026-08-26

    security-code:
        # CodeQL over the collection's Python: plugins/{filter,lookup,modules}.
        # security-code.yml, not the legacy Go-only security-codeql.yml.
        permissions:
            actions: read
            contents: read
            security-events: write
        uses: arillso/.github/.github/workflows/security-code.yml@2026-08-26
        with:
            languages: '["python"]'
            concurrency-suffix: security-code

    security-config:
        # Trivy IaC scan over the roles. Reports only — fail-on-findings stays
        # false so a nightly finding surfaces in the Security tab without
        # turning the scheduled run red.
        permissions:
            contents: read
            security-events: write
        uses: arillso/.github/.github/workflows/security-config.yml@2026-08-26
        with:
            scan-ansible: true
            ansible-path: roles
            concurrency-suffix: security-config

    security-sbom:
        # Filesystem SBOM: the collection ships no container image and no Go
        # module, so `filesystem` over the repo root is the applicable type.
        # `contents: write` mirrors the reusable's own top-level declaration.
        # A called workflow can never receive more than the calling job grants,
        # so a narrower scope here makes GitHub reject the whole workflow with
        # a startup failure before any job runs — no logs, no annotations.
        # This run only uploads an artifact, but the grant must match the
        # declaration, not the subset of it the run actually exercises.
        permissions:
            contents: write
        uses: arillso/.github/.github/workflows/security-sbom.yml@2026-08-26
        with:
            artifact-type: filesystem
            artifact-ref: .
            concurrency-suffix: security-sbom
