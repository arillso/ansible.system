---
- name: Verify — arillso.system.ansible
  hosts: all
  become: true
  gather_facts: false

  tasks:
      - name: Stat pipx home
        ansible.builtin.stat:
            path: /opt/pipx
        register: _pipx_home

      - name: Assert pipx home is a directory
        ansible.builtin.assert:
            that:
                - _pipx_home.stat.exists
                - _pipx_home.stat.isdir

      - name: Confirm ansible binary is installed via pipx
        ansible.builtin.command:
            cmd: /opt/pipx/bin/ansible --version
        changed_when: false
        register: _ansible_version

      - name: Assert ansible-core is callable
        ansible.builtin.assert:
            that:
                - "'ansible' in _ansible_version.stdout"

      # The timer starts without running the service (no Requires=), so the
      # placeholder repo is never cloned; only the rendered unit is checked.
      - name: Read rendered service unit
        ansible.builtin.slurp:
            src: /etc/systemd/system/ansible-pull.service
        register: _service_unit

      - name: Read rendered timer unit
        ansible.builtin.slurp:
            src: /etc/systemd/system/ansible-pull.timer
        register: _timer_unit

      - name: Assert units are rendered correctly
        ansible.builtin.assert:
            that:
                - "'omit_place_holder' not in _service_unit.content | b64decode"
                - "'git clone --no-checkout https://example.com/placeholder.git' in _service_unit.content | b64decode"
                - "'checkout --force --detach FETCH_HEAD' in _service_unit.content | b64decode"
                - "'Environment=' not in _service_unit.content | b64decode"
                - "'Requires=' not in _timer_unit.content | b64decode"

      - name: Check service did not run on timer start
        ansible.builtin.stat:
            path: /var/lib/ansible-automation/repo
        register: _checkout

      - name: Assert checkout was not created
        ansible.builtin.assert:
            that:
                - not _checkout.stat.exists
