---
# The geerlingguy/docker-*-ansible images ship with an empty apt cache
# (apt-get clean is part of their build), so the role's package installs
# fail with "No package matching '<pkg>' is available" until the index is
# refreshed. Prime the cache here; the converge then installs cleanly.
- name: Prepare — refresh package cache
  hosts: all
  become: true

  tasks:
      - name: Update apt cache (Debian family)
        ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 3600
        when: ansible_facts['os_family'] == "Debian"

      - name: Update dnf cache (RedHat family)
        ansible.builtin.dnf:
            update_cache: true
        when: ansible_facts['os_family'] == "RedHat"

      # A stale cache file and an old deployment record: the role must
      # delete the first and keep the second.
      - name: Create the facts cache directory
        ansible.builtin.file:
            path: /var/cache/ansible-facts
            state: directory
            mode: "0700"

      - name: Create stale cache fixtures
        ansible.builtin.copy:
            dest: "/var/cache/ansible-facts/{{ item }}"
            content: "{}"
            mode: "0600"
        loop:
            - stale.json
            - last_run.json

      - name: Age the cache fixtures by 30 days
        ansible.builtin.command: touch -d "30 days ago" /var/cache/ansible-facts/stale.json /var/cache/ansible-facts/last_run.json
        changed_when: true
