---
# Container-safe converge: renders the config and checks the nftables syntax
# without loading it into the kernel, which fails in containers depending on
# the host kernel and netfilter modules. The role's reload handler is not run;
# an nft syntax check runs instead.

- name: Converge — arillso.system.firewall (syntax-mode)
  hosts: all
  become: true

  vars:
      _molecule_firewall_syntax_only: true
      firewall_tables:
          - table:
                name: filter
                family: inet
                chains:
                    - name: input
                      type: filter
                      hook: input
                      priority: 0
                      policy: drop
                      rules:
                          - comment: "Accept loopback"
                            iifname: "lo"
                            action: accept
                          - comment: "Accept established"
                            ct_state: ["established", "related"]
                            action: accept
                          - comment: "Accept new SSH connections, rate-limited"
                            tcp_dport: 22
                            ct_state: ["new"]
                            limit: "10/minute"
                            burst: 5
                            action: accept
                          - comment: "Log packets before the chain policy drops them"
                            limit: "5/minute"
                            log_prefix: "nft-drop-input: "
                            log_level: info
                            action: drop
                            order: 1000
      # Host level exercises merging, order, sets, a regular chain and a
      # second table.
      firewall_host:
          - table:
                name: filter
                family: inet
                sets:
                    - name: trusted
                      type: ipv4_addr
                      flags: [interval]
                      elements: ["192.0.2.0/24"]
                chains:
                    - name: web
                      rules:
                          - comment: "Accept HTTP(S)"
                            tcp_dport: [80, 443]
                            action: accept
                    - name: input
                      rules:
                          - comment: "Trusted networks reach web"
                            ip_saddr_set: "@trusted"
                            action: jump
                            target_chain: web
          - table:
                name: nat
                family: ip
                chains:
                    - name: postrouting
                      type: nat
                      hook: postrouting
                      priority: 100
                      policy: accept
                      rules:
                          - oifname: "eth0"
                            action: masquerade

  tasks:
      - name: Render hierarchical firewall payload only
        ansible.builtin.set_fact:
            _firewall_tables: >-
                {{ {
                    'firewall_tables': firewall_tables | default([]),
                    'firewall_global': firewall_global | default([]),
                    'firewall_group': firewall_group | default([]),
                    'firewall_host': firewall_host | default([])
                } | arillso.system.to_nftables_hierarchy }}

      # Normally built from /etc/nftables.managed; `ip stale` stands for a
      # table removed from the YAML.
      - name: Set tables to reset
        ansible.builtin.set_fact:
            _firewall_reset_tables: ["inet filter", "ip nat", "ip stale"]

      - name: Generate nftables.conf from template (controller-side render only)
        ansible.builtin.template:
            src: "{{ playbook_dir }}/../../../roles/firewall/templates/etc/nftables.conf.j2"
            dest: /etc/nftables.conf
            mode: "0644"

      # `nft -c -f` parses the ruleset AND dry-runs it against the kernel,
      # so on a container without the conntrack modules loaded it exits 2
      # with an empty stderr even though the file is syntactically valid
      # (the `ct state` matches can't be resolved). A genuine syntax error,
      # by contrast, prints a parser diagnostic to stderr. Treat a non-zero
      # rc as a failure only when nft actually reported something — that
      # separates real parse errors from the container's missing-module
      # noise while still catching template regressions.
      - name: Syntax-check the rendered ruleset with nft -c
        ansible.builtin.command:
            cmd: nft -c -f /etc/nftables.conf
        changed_when: false
        register: _nft_check
        failed_when:
            - _nft_check.rc != 0
            - _nft_check.stderr | length > 0
