---
- name: Converge — arillso.system.packages
  hosts: all
  become: true

  vars:
      packages_cache_enabled: true
      packages_list:
          - name: htop
            state: present
          - name: jq
            state: present
      packages_keys: []
      packages_repositories: []
      packages_unattended_upgrades_enabled: false

  tasks:
      - name: Apply packages role
        ansible.builtin.include_role:
            name: arillso.system.packages

      # The dearmor branch below shells out to gpg, which the bookworm
      # image does not ship. Installing it here keeps the two includes
      # exercising different dispatch types (url-direct vs url-dearmor) —
      # the mismatch this scenario guards against was only visible because
      # the two keys took different branches.
      - name: Ensure gpg is available for the dearmor branch
        ansible.builtin.package:
            name: gnupg
            state: present

      # Two consecutive `keys` includes, one key each, mirror how consuming
      # roles call this role (tailscale sets its key, alloy then sets
      # grafana's). `_packages_keys_normalised` used to survive between the
      # two calls, so the second run re-processed the first key's entry and
      # wrote one vendor's key into the other's keyring.
      - name: Apply first signing key
        ansible.builtin.include_role:
            name: arillso.system.packages
            tasks_from: keys
        vars:
            packages_keys:
                - url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
                  state: present
                  keyring: /usr/share/keyrings/molecule-first-keyring.gpg
                  name: molecule-first

      # Asserted here rather than in verify.yml: molecule runs converge and
      # verify as separate ansible-playbook processes, and this scenario
      # configures no fact cache, so a non-cacheable set_fact would be
      # undefined by the time verify runs.
      - name: Assert the first include saw only its own entry
        ansible.builtin.assert:
            that:
                - _packages_keys_normalised | length == 1
                - _packages_keys_normalised[0].label == 'molecule-first'
                - "'tailscale' in _packages_keys_normalised[0].item.url"

      - name: Apply second signing key
        ansible.builtin.include_role:
            name: arillso.system.packages
            tasks_from: keys
        vars:
            packages_keys:
                - url: https://apt.grafana.com/gpg.key
                  state: present
                  keyring: /usr/share/keyrings/molecule-second-keyring.gpg
                  name: molecule-second
                  dearmor: true

      - name: Assert the first entry did not leak into the second include
        ansible.builtin.assert:
            that:
                - _packages_keys_normalised | length == 1
                - _packages_keys_normalised[0].label == 'molecule-second'

      - name: Assert url and keyring belong to the same key
        ansible.builtin.assert:
            that:
                - "'molecule-second' in _packages_keys_normalised[0].keyring"
                - "'grafana' in _packages_keys_normalised[0].item.url"
