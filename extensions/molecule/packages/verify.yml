---
- name: Verify — arillso.system.packages
  hosts: all
  become: true
  gather_facts: true

  tasks:
      - name: Confirm htop is installed
        ansible.builtin.command:
            cmd: htop --version
        changed_when: false
        register: _htop

      - name: Assert htop is installed
        ansible.builtin.assert:
            that:
                - _htop.rc == 0

      - name: Confirm jq is installed
        ansible.builtin.command:
            cmd: jq --version
        changed_when: false
        register: _jq

      - name: Assert jq is installed
        ansible.builtin.assert:
            that:
                - _jq.rc == 0

      - name: Stat the keyring written by the first include
        ansible.builtin.stat:
            path: /usr/share/keyrings/molecule-first-keyring.gpg
        register: _molecule_first_keyring

      - name: Stat the keyring written by the second include
        ansible.builtin.stat:
            path: /usr/share/keyrings/molecule-second-keyring.gpg
        register: _molecule_second_keyring

      - name: Assert both keyrings exist and hold different keys
        ansible.builtin.assert:
            that:
                - _molecule_first_keyring.stat.exists
                - _molecule_second_keyring.stat.exists
                - _molecule_first_keyring.stat.checksum
                  != _molecule_second_keyring.stat.checksum
