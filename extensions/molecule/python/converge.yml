---
- name: Converge — arillso.system.python
  hosts: all
  become: true

  vars:
      python_install_packages: true
      # virtualenv_python must not be set together with the venv module
      # (virtualenv_command: python3 -m venv) — pip rejects it with
      # "virtualenv_python should not be used when using the venv module".
      # The venv command already pins the interpreter.
      python_packages:
          - name: requests
            state: present
            virtualenv: /opt/molecule-venv
            virtualenv_command: python3 -m venv
          # System-wide: needs python_pip_break_system_packages on Debian 12
          # (PEP 668).
          - name: python-dotenv
            state: present
      # Default virtualenv_command/virtualenv_python and executable: covers
      # the executable|virtualenv and venv|virtualenv_python guards.
      python_requirements_files:
          - path: /opt/molecule-requirements.txt
            virtualenv: /opt/molecule-req-venv
      python_upgrade_pip: true
      python_pip_break_system_packages: true

  tasks:
      - name: Apply python role
        ansible.builtin.include_role:
            name: arillso.system.python
