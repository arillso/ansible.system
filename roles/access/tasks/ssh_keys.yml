---
# Keys come from access_ssh_keys, or from _access_ssh_key_list when users.yml
# includes this file with the keys flattened out of access_users.
#
# authorized_key with exclusive=true removes every key not passed in the same
# call. A user with any present exclusive key therefore gets one call with all
# of that user's present keys from both sources (_access_ssh_all_keys), so the
# users.yml run and the main.yml run write the same content. key_options are
# written as the line prefix, because the module parameter would apply to
# every key in the call. URL and file:// keys are fetched by the module only
# when `key` starts with the scheme, so an exclusive user may use one only as
# the single key; the assert below rejects other combinations.
- name: Manage SSH authorized keys
  ansible.posix.authorized_key:
      user: "{{ _access_ssh_key_item.user }}"
      key: "{{ _access_ssh_key_item.key }}"
      key_options: "{{ _access_ssh_key_item.key_options | default(omit) }}"
      state: "{{ _access_ssh_key_item.state | default('present') }}"
  become: true
  loop: "{{ _access_ssh_keys | rejectattr('user', 'in', _access_ssh_exclusive_users) | list }}"
  loop_control:
      loop_var: _access_ssh_key_item
      label: "{{ _access_ssh_key_item.user }}"
  retries: "{{ access_retry_count }}"
  delay: "{{ access_retry_delay }}"
  register: _access_ssh_keys_result
  until: _access_ssh_keys_result is succeeded

- name: Validate exclusive SSH keys
  ansible.builtin.assert:
      that:
          - >-
              _access_ssh_user_lines | length == 1
              or _access_ssh_user_lines | select('match', '^(https?|file)://') | list | length == 0
      fail_msg: >-
          SSH user '{{ _access_ssh_user }}' has an exclusive key: a URL or file:// key
          must then be the only present key of that user
      quiet: true
  vars:
      _access_ssh_user_lines: >-
          {%- set _lines = [] -%}
          {%- for _k in _access_ssh_all_keys
              if _k.user == _access_ssh_user and _k.state | default('present') == 'present' -%}
          {%- set _ = _lines.append(_k.key) -%}
          {%- endfor -%}
          {{ _lines }}
  loop: "{{ _access_ssh_exclusive_users | intersect(_access_ssh_keys | map(attribute='user') | list) }}"
  loop_control:
      loop_var: _access_ssh_user

- name: Manage exclusive SSH authorized keys
  ansible.posix.authorized_key:
      user: "{{ _access_ssh_user }}"
      # Double-quoted so YAML turns \n into a newline; a block scalar keeps it literal
      key: "{{ _access_ssh_user_lines | join('\n') }}"
      exclusive: true
  vars:
      _access_ssh_user_lines: >-
          {%- set _lines = [] -%}
          {%- for _k in _access_ssh_all_keys
              if _k.user == _access_ssh_user and _k.state | default('present') == 'present' -%}
          {%- set _ = _lines.append((_k.key_options ~ ' ' if _k.key_options | default('') else '') ~ _k.key) -%}
          {%- endfor -%}
          {{ _lines }}
  become: true
  # Only users with keys in this run; the other run handles the rest
  loop: "{{ _access_ssh_exclusive_users | intersect(_access_ssh_keys | map(attribute='user') | list) }}"
  loop_control:
      loop_var: _access_ssh_user
  retries: "{{ access_retry_count }}"
  delay: "{{ access_retry_delay }}"
  register: _access_ssh_keys_exclusive_result
  until: _access_ssh_keys_exclusive_result is succeeded
