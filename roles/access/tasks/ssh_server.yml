---
# sshd supports Include only from OpenSSH 8.2; distros with older versions
# (EL 8) ship no drop-in directory, so its presence gates the Include.
- name: Check SSH drop-in directory
  ansible.builtin.stat:
      path: "{{ access_ssh_include_dir }}"
  register: _access_ssh_include_dir_stat
  when: access_ssh_include_dir | length > 0

- name: Decide whether to include SSH drop-ins
  ansible.builtin.set_fact:
      _access_ssh_include_enabled: >-
          {{ access_ssh_include_dir | length > 0
             and (_access_ssh_include_dir_stat.stat.isdir | default(false)) }}

- name: Deploy SSH server configuration
  ansible.builtin.template:
      src: etc/ssh/sshd_config.j2
      dest: /etc/ssh/sshd_config
      owner: root
      group: root
      mode: "0644"
      validate: "{{ 'sshd -t -f %s' if access_validate_ssh_config else omit }}"
      backup: "{{ access_backup_configs }}"
  become: true
  notify: "access: restart sshd"
  retries: "{{ access_retry_count }}"
  delay: "{{ access_retry_delay }}"
  register: _access_sshd_config_result
  until: _access_sshd_config_result is succeeded

- name: Manage SSH service via systemd role
  ansible.builtin.include_role:
      name: arillso.system.systemd
      tasks_from: service
  vars:
      systemd_services:
          - name: "{{ _access_ssh_service_name }}"
            enabled: "{{ access_ssh_service_enabled }}"
            state: "{{ access_ssh_service_state }}"
