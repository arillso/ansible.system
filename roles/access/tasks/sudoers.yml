---
- name: Validate sudoers entries
  ansible.builtin.assert:
      that:
          # sudo skips files in sudoers.d whose name contains '.' or ends in '~';
          # absent entries may use them to clean up such files, but never '/'
          - >-
              _access_sudoer_item.name is match('^[A-Za-z0-9_-]+$')
              or (_access_sudoer_item.state | default('present') == 'absent'
                  and _access_sudoer_item.name is match('^[A-Za-z0-9_.~-]+$')
                  and _access_sudoer_item.name not in ['.', '..'])
          - >-
              _access_sudoer_item.state | default('present') == 'absent'
              or (_access_sudoer_item.user is defined) != (_access_sudoer_item.group is defined)
      fail_msg: >-
          sudoers entry '{{ _access_sudoer_item.name }}': name may only contain
          letters, digits, '_' and '-' ('.' and '~' only with state absent), and
          exactly one of user or group is required
      quiet: true
  loop: "{{ access_sudoers }}"
  loop_control:
      loop_var: _access_sudoer_item
      label: "{{ _access_sudoer_item.name }}"

- name: Ensure sudoers.d directory exists
  ansible.builtin.file:
      path: /etc/sudoers.d
      state: directory
      owner: root
      group: root
      mode: "0750"
  become: true

- name: Deploy sudoers configuration files
  ansible.builtin.template:
      src: etc/sudoers.d/sudoer.j2
      dest: "/etc/sudoers.d/{{ _access_sudoer_item.name }}"
      owner: "{{ access_sudoers_file_owner }}"
      group: "{{ access_sudoers_file_group }}"
      mode: "{{ access_sudoers_file_mode }}"
      validate: "{{ 'visudo -cf %s' if access_validate_sudoers else omit }}"
      backup: "{{ access_backup_configs }}"
  become: true
  loop: "{{ access_sudoers }}"
  loop_control:
      loop_var: _access_sudoer_item
      label: "{{ _access_sudoer_item.name }}"
  when: _access_sudoer_item.state | default('present') == 'present'
  retries: "{{ access_retry_count }}"
  delay: "{{ access_retry_delay }}"
  register: _access_sudoers_result
  until: _access_sudoers_result is succeeded

- name: Remove sudoers configuration files
  ansible.builtin.file:
      path: "/etc/sudoers.d/{{ _access_sudoer_item.name }}"
      state: absent
  become: true
  loop: "{{ access_sudoers }}"
  loop_control:
      loop_var: _access_sudoer_item
      label: "{{ _access_sudoer_item.name }}"
  when: _access_sudoer_item.state | default('present') == 'absent'
