---
# Internal variables for access role

# SSH service names by OS family
_access_ssh_service_names:
    Debian: ssh
    RedHat: sshd
    Suse: sshd
    Alpine: openssh
    default: sshd

# Dynamically selected SSH service name
_access_ssh_service_name: >-
    {{ _access_ssh_service_names[ansible_facts['os_family']] |
       default(_access_ssh_service_names['default']) }}

# Sudoers file validation command by OS family
_access_sudoers_validation_commands:
    Debian: visudo -cf %s
    RedHat: visudo -cf %s
    Suse: visudo -cf %s
    Alpine: visudo -cf %s
    default: visudo -cf %s

# SSH config validation command by OS family
_access_ssh_validation_commands:
    Debian: sshd -t -f %s
    RedHat: sshd -t -f %s
    Suse: sshd -t -f %s
    Alpine: sshd -t -f %s
    default: sshd -t -f %s

# SSH keys handled by tasks/ssh_keys.yml; users.yml passes _access_ssh_key_list
_access_ssh_keys: "{{ _access_ssh_key_list | default(access_ssh_keys) }}"

# Users with at least one exclusive key; their keys go into one call
_access_ssh_exclusive_users: >-
    {{ _access_ssh_keys | selectattr('exclusive', 'defined') | selectattr('exclusive')
       | map(attribute='user') | unique | list }}
