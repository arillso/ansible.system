---
- name: Create ansible automation directory
  ansible.builtin.file:
      path: "{{ ansible_checkout_dir }}"
      state: directory
      mode: "0750"
      owner: root
      group: root
  become: true

- name: Create Ansible configuration directory
  ansible.builtin.file:
      path: /etc/ansible
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true

- name: Assert OpenTelemetry libraries can be installed
  ansible.builtin.assert:
      that: not ansible_otel_enabled or ansible_install_method == 'pipx'
      fail_msg: ansible_otel_enabled requires ansible_install_method pipx (the OpenTelemetry libraries are injected via pipx)

- name: Deploy Ansible environment file
  ansible.builtin.template:
      src: etc/ansible/ansible.env.j2
      dest: /etc/ansible/ansible.env
      mode: "0600"
      owner: root
      group: root
  become: true

- name: Build ExecStart command for pull mode
  ansible.builtin.set_fact:
      ansible_role_exec_start_pull: >-
          {% if ansible_install_method == 'pipx' -%}
          {{ ansible_pipx_bin }}/ansible-pull{%- else -%}
          /usr/bin/ansible-pull{%- endif %}
          --url {{ ansible_repo }}
          --checkout {{ ansible_branch }}
          --directory {{ ansible_checkout_dir }}/repo
          --inventory {{ ansible_checkout_dir }}/repo/{{ ansible_inventory }}
          --limit {{ ansible_host_limit }}
          --accept-host-key
          --extra-vars "ansible_connection=local"
          {% if ansible_extra_args -%}
          {{ ansible_extra_args }}{%- endif %}
          {{ ansible_playbook }}
  when: ansible_mode == 'pull'

- name: Build ExecStart command for playbook mode
  ansible.builtin.set_fact:
      ansible_role_exec_start_playbook: >-
          {% if ansible_install_method == 'pipx' -%}
          {{ ansible_pipx_bin }}/ansible-playbook{%- else -%}
          /usr/bin/ansible-playbook{%- endif %}
          --inventory {{ ansible_checkout_dir }}/repo/{{ ansible_inventory }}
          --limit {{ ansible_host_limit }}
          --extra-vars "ansible_connection=local"
          {% if ansible_extra_args -%}
          {{ ansible_extra_args }}{%- endif %}
          {{ ansible_checkout_dir }}/repo/{{ ansible_playbook }}
  when: ansible_mode == 'playbook'

- name: Build galaxy collection install command
  ansible.builtin.set_fact:
      ansible_role_galaxy_collections_cmd: >-
          -{% if ansible_install_method == 'pipx' -%}
          {{ ansible_pipx_bin }}/ansible-galaxy{%- else -%}
          /usr/bin/ansible-galaxy{%- endif %}
          collection install
          -r {{ ansible_checkout_dir }}/repo/{{ ansible_requirements_file }}
          --force
  when: ansible_install_collections | bool

- name: Build galaxy role install command
  ansible.builtin.set_fact:
      ansible_role_galaxy_roles_cmd: >-
          -{% if ansible_install_method == 'pipx' -%}
          {{ ansible_pipx_bin }}/ansible-galaxy{%- else -%}
          /usr/bin/ansible-galaxy{%- endif %}
          role install
          -r {{ ansible_checkout_dir }}/repo/{{ ansible_requirements_file }}
          --force
  when: ansible_install_roles | bool

# Clone or update the checkout before the galaxy installs, so requirements
# always come from the revision that is about to run. fetch + forced detached
# checkout recovers from force pushes, branch switches and local edits, like
# ansible-pull's own checkout. accept-new mirrors --accept-host-key and is
# scoped to this command only.
# ponytail: ansible_branch must be a branch or tag here, not a commit SHA.
- name: Build ExecStartPre commands
  ansible.builtin.set_fact:
      ansible_role_exec_start_pre: >-
          {{ ['/usr/bin/env "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new" /bin/sh -c "' +
              '[ -d ' + ansible_checkout_dir + '/repo/.git ] || /usr/bin/git clone --no-checkout ' +
              ansible_repo + ' ' + ansible_checkout_dir + '/repo; ' +
              '/usr/bin/git -C ' + ansible_checkout_dir + '/repo fetch origin ' + ansible_branch +
              ' && /usr/bin/git -C ' + ansible_checkout_dir + '/repo checkout --force --detach FETCH_HEAD"'] +
             (ansible_install_collections | bool | ternary([ansible_role_galaxy_collections_cmd], [])) +
             (ansible_install_roles | bool | ternary([ansible_role_galaxy_roles_cmd], [])) }}

- name: Build environment variables for systemd
  ansible.builtin.set_fact:
      # Quote each assignment so values with spaces survive; % is escaped
      # because systemd expands specifiers.
      # ponytail: values containing " or \ are not escaped (backslash handling
      # in Jinja literals differs across ansible-core versions).
      ansible_role_env_list: >-
          {{ ansible_environment.keys() | zip(ansible_environment.values()) | map('join', '=')
             | map('replace', '%', '%%') | map('regex_replace', '^|$', '"') | list }}

- name: Deploy ansible systemd units via systemd role
  ansible.builtin.include_role:
      name: arillso.system.systemd
      tasks_from: unit
  vars:
      systemd_units:
          - name: "{{ ansible_service_name }}.service"
            state: present
            unit:
                Unit:
                    Description: >-
                        {{ 'Ansible Pull Automation' if ansible_mode == 'pull'
                           else 'Ansible Playbook Automation' }}
                    After: network-online.target
                    Wants: network-online.target
                Service:
                    Type: oneshot
                    EnvironmentFile: "-/etc/ansible/ansible.env"
                    # % and $ are systemd specifiers/expansions; ExecStart keeps $ so
                    # ansible_extra_args can still reference EnvironmentFile variables.
                    ExecStartPre: >-
                        {{ ansible_role_exec_start_pre | map('replace', '%', '%%')
                           | map('replace', '$', '$$') | list }}
                    ExecStart: >-
                        {{ (ansible_role_exec_start_pull if ansible_mode == 'pull'
                           else ansible_role_exec_start_playbook) | replace('%', '%%') }}
                    # "-": the checkout only exists after the first ExecStartPre clone
                    WorkingDirectory: >-
                        {{ ansible_checkout_dir if ansible_mode == 'pull'
                           else '-' + ansible_checkout_dir + '/repo' }}
                    Environment: "{{ ansible_role_env_list }}"
                Install:
                    WantedBy: multi-user.target

          - name: "{{ ansible_service_name }}.timer"
            state: present
            unit:
                Unit:
                    Description: Ansible Automation Timer
                Timer:
                    OnCalendar: "{{ ansible_schedule }}"
                    RandomizedDelaySec: "{{ ansible_random_delay }}"
                    Persistent: "true"
                Install:
                    WantedBy: timers.target

- name: Enable and start timer via systemd role
  ansible.builtin.include_role:
      name: arillso.system.systemd
      tasks_from: service
  vars:
      systemd_services:
          - name: "{{ ansible_service_name }}.timer"
            enabled: "{{ ansible_service_enabled }}"
            state: "{{ ansible_timer_state }}"
            daemon_reload: true
