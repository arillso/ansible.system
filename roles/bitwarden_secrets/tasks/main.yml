---
- name: Assert supported architecture
  ansible.builtin.assert:
      that: bitwarden_secrets_arch | length > 0
      fail_msg: >-
          No bws release for architecture '{{ ansible_facts['architecture'] }}'.
          Supported: {{ _bitwarden_secrets_arch_map.keys() | join(', ') }}.
          Set bitwarden_secrets_arch to override.
      quiet: true
  when: bitwarden_secrets_state == 'present'
  tags: ["bitwarden_secrets"]

- name: Install required packages
  ansible.builtin.package:
      name: "{{ bitwarden_secrets_required_packages }}"
      state: present
  become: true
  retries: "{{ bitwarden_secrets_retry_count }}"
  delay: "{{ bitwarden_secrets_retry_delay }}"
  register: _bitwarden_secrets_packages
  until: _bitwarden_secrets_packages is succeeded
  when: bitwarden_secrets_state == 'present'
  tags: ["bitwarden_secrets", "packages"]

- name: Check if bws is installed
  ansible.builtin.stat:
      path: "{{ bitwarden_secrets_install_path }}/{{ bitwarden_secrets_binary_name }}"
  register: _bitwarden_secrets_installed
  tags: ["bitwarden_secrets"]

- name: Get installed bws version
  # Read-only probe; an existing binary that errors on --version is
  # equivalent to "version unknown" and the install-needed check below
  # will reinstall it.
  ansible.builtin.command:
      cmd: "{{ bitwarden_secrets_install_path }}/{{ bitwarden_secrets_binary_name }} --version"
  register: _bitwarden_secrets_current_version
  changed_when: false
  failed_when: false
  when: _bitwarden_secrets_installed.stat.exists
  tags: ["bitwarden_secrets"]

- name: Determine if installation is needed
  ansible.builtin.set_fact:
      # `bws --version` prints "bws <version>"; compare exactly, not as substring.
      _bitwarden_secrets_needs_install: >-
          {{
            bitwarden_secrets_state == 'present' and
            (
              not _bitwarden_secrets_installed.stat.exists or
              bitwarden_secrets_force_install or
              (_bitwarden_secrets_current_version.stdout | default('') | trim) != ('bws ' ~ bitwarden_secrets_version)
            )
          }}
  tags: ["bitwarden_secrets"]

- name: Install bws CLI
  when: _bitwarden_secrets_needs_install | bool
  tags: ["bitwarden_secrets", "install"]
  block:
      - name: Create private download directory
        ansible.builtin.tempfile:
            state: directory
            prefix: bws-
        register: _bitwarden_secrets_tmp
        check_mode: false

      - name: Download bws CLI
        ansible.builtin.get_url:
            url: "{{ bitwarden_secrets_download_url }}"
            dest: "{{ _bitwarden_secrets_tmp.path }}/bws.zip"
            checksum: "sha256:{{ bitwarden_secrets_checksum_url }}"
            mode: "0600"
            timeout: "{{ bitwarden_secrets_download_timeout }}"
        retries: "{{ bitwarden_secrets_retry_count }}"
        delay: "{{ bitwarden_secrets_retry_delay }}"
        register: _bitwarden_secrets_download
        until: _bitwarden_secrets_download is succeeded

      - name: Ensure install directory exists
        ansible.builtin.file:
            path: "{{ bitwarden_secrets_install_path }}"
            state: directory
            mode: "0755"
        become: true

      - name: Extract bws CLI
        ansible.builtin.unarchive:
            src: "{{ _bitwarden_secrets_tmp.path }}/bws.zip"
            dest: "{{ bitwarden_secrets_install_path }}"
            remote_src: true
            mode: "0755"
        become: true
        # ponytail: get_url writes nothing in check mode, so there is no archive to extract
        when: not ansible_check_mode
  always:
      - name: Clean up download
        ansible.builtin.file:
            path: "{{ _bitwarden_secrets_tmp.path }}"
            state: absent
        check_mode: false
        when: _bitwarden_secrets_tmp.path is defined

- name: Ensure bws is executable
  ansible.builtin.file:
      path: "{{ bitwarden_secrets_install_path }}/{{ bitwarden_secrets_binary_name }}"
      mode: "0755"
      owner: root
      group: root
  become: true
  when:
      - bitwarden_secrets_state == 'present'
      - _bitwarden_secrets_installed.stat.exists or (_bitwarden_secrets_needs_install | bool and not ansible_check_mode)
  tags: ["bitwarden_secrets"]

- name: Remove bws binary
  ansible.builtin.file:
      path: "{{ bitwarden_secrets_install_path }}/{{ bitwarden_secrets_binary_name }}"
      state: absent
  become: true
  when: bitwarden_secrets_state == 'absent'
  tags: ["bitwarden_secrets", "uninstall"]
