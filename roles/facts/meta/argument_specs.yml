---
# Argument specifications for Facts role - Enterprise-grade validation
# Only documents variables that are actually used in the role implementation

argument_specs:
    main:
        short_description: "Collect system facts and metadata with K3s integration"
        description: |
            Enterprise-grade facts collection role that gathers system information,
            cloud metadata, and provides K3s cluster state detection.

        examples: |
            - name: Collect custom facts for a worker node
              hosts: all
              become: true
              roles:
                  - role: arillso.system.facts
                    vars:
                        facts_node_type: worker
                        facts_system_owner: platform-team
                        facts_system_tags:
                            - managed
                            - k3s
        options:
            # Core role identification (defaults set dynamically in defaults/main.yml)
            facts_role_name:
                type: str
                description: >-
                    Internal role identifier for facts collection.
                    Default: ansible_role_name, else "facts".

            facts_collection_name:
                type: str
                description: >-
                    Full collection name for metadata tracking.
                    Default: ansible_collection_name, else "arillso.system".

            facts_version:
                type: str
                description: >-
                    Collection version on the controller.
                    Default: version from MANIFEST.json of the installed collection, else from
                    galaxy.yml of a source checkout, else an empty string.

            # Node classification
            facts_node_type:
                type: str
                default: "generic"
                choices: ["generic", "controller", "agent", "gateway", "worker"]
                description: "Node type classification used in facts output"

            # System metadata
            facts_system_owner:
                type: str
                default: "ops-team"
                description: "Team or individual responsible for system maintenance"

            facts_system_tags:
                type: list
                elements: str
                default: ["managed", "facts"]
                description: "List of tags for system classification and metadata"

            facts_playbook_name:
                type: str
                default: "facts"
                description: "Name of playbook executing the role for audit trail"

            # Feature flags for facts collection
            facts_enable_cloud_metadata:
                type: bool
                default: true
                description: "Enable cloud provider metadata collection"

            facts_enable_security_updates:
                type: bool
                default: true
                description: "Enable security update information collection"

            facts_enable_static_cache:
                type: bool
                default: true
                description: "Cache system.fact output (also requires facts_cache_enabled)"

            # Universal facts configuration (harmonized across all scripts)
            facts_enable_container_detection:
                type: bool
                default: true
                description: "Master switch for all facts_container_detect_* flags"

            facts_cache_enabled:
                type: bool
                default: true
                description: >-
                    Universal cache enablement for all facts scripts. When false, the
                    shell MOTD runs the security and cloud probes on every login.

            facts_cache_dir:
                type: str
                default: "/var/cache/ansible-facts"
                description: "Universal cache directory for all facts scripts"

            facts_cache_default_ttl:
                type: int
                default: 300
                description: "Default cache TTL in seconds (5 minutes)"

            facts_timeout_default:
                type: int
                default: 5
                description: "Default timeout in seconds for all operations"

            facts_timeout_api:
                type: int
                default: 10
                description: "Timeout in seconds for API calls"

            facts_max_retries:
                type: int
                default: 1
                description: "Maximum number of retries for network operations"

            # Script-specific cache TTL configuration
            facts_cache_ttl_cloud:
                type: int
                default: 3600
                description: "Cache TTL for cloud metadata (1 hour)"

            facts_cache_ttl_container:
                type: int
                default: 300
                description: "Cache TTL for container facts (5 minutes)"

            facts_cache_ttl_security:
                type: int
                default: 300
                description: "Cache TTL for security facts (5 minutes)"

            facts_cache_ttl_system:
                type: int
                default: 86400
                description: "Cache TTL for system facts (24 hours)"

            facts_cache_cleanup_enabled:
                type: bool
                default: true
                description: "Delete stale files in facts_cache_dir at every role run (last_run.json is kept)"

            facts_cache_cleanup_age_days:
                type: int
                default: 7
                description: "Age in days after which a cache file counts as stale"

            facts_script_execution_timeout:
                type: int
                default: 30
                description: "Hard limit in seconds for one run of a fact script"

            facts_error_on_failure:
                type: bool
                default: false
                description: "Fail the role when a fact script returns no valid JSON"

            facts_system_collect_hardware:
                type: bool
                default: true
                description: "Report processor_cores and memory_mb in system facts"

            facts_system_collect_network:
                type: bool
                default: true
                description: "Report network_addresses, network_interfaces_count, ipv4 and ipv6 in system facts"

            facts_system_collect_storage:
                type: bool
                default: true
                description: "Report root filesystem size and usage (storage.root), collected on every run"

            facts_system_collect_performance:
                type: bool
                default: true
                description: "Report load average and uptime (performance), collected on every run"

            facts_system_collect_virtualization:
                type: bool
                default: true
                description: "Report virtualization_type in system facts"

            facts_cache_ttl_network:
                type: int
                default: 1800
                description: "Cache TTL for network facts (30 minutes)"

            facts_container_collect_inventory:
                type: bool
                default: true
                description: "Report Ansible inventory groups in container facts"

            facts_container_collect_health:
                type: bool
                default: true
                description: "Run runtime health probes (docker info, kubectl get nodes, ...)"

            facts_container_collect_volumes:
                type: bool
                default: true
                description: "Report volumes_count of a running docker/podman engine"

            facts_container_collect_networks:
                type: bool
                default: true
                description: "Report networks_count of a running docker/podman engine"

            facts_network_collect_interfaces:
                type: bool
                default: true
                description: "Report interfaces with state, MAC and addresses in network facts"

            facts_network_collect_routes:
                type: bool
                default: true
                description: "Report default gateways and route counts in network facts"

            facts_network_collect_dns:
                type: bool
                default: true
                description: "Report nameservers and search domains in network facts"

            facts_network_collect_firewall:
                type: bool
                default: true
                description: "Report the active firewall frontend in network facts"

            # Cloud metadata configuration
            facts_cloud_metadata_base_url:
                type: str
                default: "http://169.254.169.254"
                description: "Base URL for cloud metadata services"

            facts_cloud_providers_enabled:
                type: list
                elements: str
                default:
                    - "aws"
                    - "digitalocean"
                    - "hetzner"
                    - "gcp"
                    - "vultr"
                    - "generic"
                description: "List of cloud providers to detect and support"

            # Security facts configuration
            facts_security_command_timeout:
                type: int
                default: 15
                description: "Extended timeout for package manager security operations"

            # Debug configuration
            facts_debug_enabled:
                type: bool
                default: false
                description: "Enable debug logging for facts collection"

            # Container-specific configuration
            facts_container_detect_docker:
                type: bool
                default: true
                description: "Enable Docker runtime detection"

            facts_container_detect_podman:
                type: bool
                default: true
                description: "Enable Podman runtime detection"

            facts_container_detect_kubernetes:
                type: bool
                default: true
                description: "Enable Kubernetes (K3s/K8s/MicroK8s) runtime detection"

            facts_container_detect_containerd:
                type: bool
                default: true
                description: "Enable containerd runtime detection"
