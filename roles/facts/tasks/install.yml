---
# Install packages, directories and scripts for local facts collection

- name: "Install required packages for facts collection"
  ansible.builtin.package:
      name: "{{ _facts_required_packages[ansible_facts['os_family']] | default(_facts_required_packages['Debian']) }}"
      state: present
  become: true
  tags:
      - facts
      - packages

- name: "Create facts collection directory"
  ansible.builtin.file:
      path: /etc/ansible/facts.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  tags:
      - facts

- name: "Install facts collection scripts"
  ansible.builtin.template:
      src: "etc/ansible/facts.d/{{ item }}.j2"
      dest: "/etc/ansible/facts.d/{{ item }}"
      mode: "0755"
      owner: root
      group: root
  become: true
  loop: "{{ _facts_collection_scripts }}"
  tags:
      - facts

# last.fact rewrote last_run.json on every fact gather; the role now
# records the deployment itself (tasks/main.yml).
- name: "Remove retired last.fact script"
  ansible.builtin.file:
      path: /etc/ansible/facts.d/last.fact
      state: absent
  become: true
  tags:
      - facts

- name: "Create facts cache directory"
  ansible.builtin.file:
      path: "{{ facts_cache_dir }}"
      state: directory
      mode: "0700"
      owner: root
      group: root
  become: true
  tags:
      - facts
      - cache
