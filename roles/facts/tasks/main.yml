---
# Facts collection entry point - Install and configure facts scripts only
# Usage: include_role: name=facts tasks_from=facts

- name: "Gather system facts for role operation"
  ansible.builtin.setup:
      gather_subset:
          - all
  tags:
      - facts

- name: Install and configure facts collection
  ansible.builtin.include_tasks: install.yml
  tags:
      - facts
      - packages
      - cache

# Deployment record shown as "Last Deployment" in the MOTD and read by
# run.fact. Written here, not by a fact script, so it changes only when
# the role runs and not on every fact gather.
- name: "Record this deployment in last_run.json"
  ansible.builtin.copy:
      dest: "{{ facts_cache_dir }}/last_run.json"
      mode: "0600"
      owner: root
      group: root
      content: >-
          {{ {
              'timestamp': ansible_facts['date_time']['iso8601'],
              'timestamp_human': ansible_facts['date_time']['date'] ~ ' '
                  ~ ansible_facts['date_time']['time'] ~ ' ' ~ ansible_facts['date_time']['tz'],
              'epoch': ansible_facts['date_time']['epoch'] | int,
              'date': ansible_facts['date_time']['date'],
              'time': ansible_facts['date_time']['time'],
              'user': ansible_user | default('system'),
              'playbook': facts_playbook_name,
              'playbook_dir': playbook_dir | default('unknown'),
              'ansible_version': ansible_version.full
          } | to_nice_json }}
  become: true
  # The timestamp differs on every run; the record is metadata, not
  # configuration drift, so it does not count as a change.
  changed_when: false
  tags:
      - facts

- name: Refresh facts from local scripts
  ansible.builtin.setup:
      gather_subset:
          - "!all"
          - "!any"
          - "local"
  tags:
      - facts
