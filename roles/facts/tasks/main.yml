---
# Facts collection entry point - Install and configure facts scripts only
# Usage: include_role: name=facts tasks_from=facts

- name: "Gather system facts for role operation"
  ansible.builtin.setup:
      gather_subset:
          - all
  tags:
      - facts

- name: Install and configure facts collection
  ansible.builtin.include_tasks: install.yml
  tags:
      - facts
      - packages
      - cache

- name: Refresh facts from local scripts
  ansible.builtin.setup:
      gather_subset:
          - "!all"
          - "!any"
          - "local"
  tags:
      - facts

- name: Fail on fact scripts without valid output
  ansible.builtin.assert:
      that:
          - _facts_value is mapping
      fail_msg: "{{ item }} returned no valid JSON: {{ _facts_value }}"
      quiet: true
  vars:
      _facts_value: "{{ (ansible_local | default({}))[item | regex_replace('\\.fact$', '')] | default('no output') }}"
  loop: "{{ _facts_collection_scripts }}"
  when: facts_error_on_failure | bool
  tags:
      - facts
