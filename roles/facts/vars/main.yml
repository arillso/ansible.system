---
# Internal variables for Facts role
# These variables should not be overridden by users

# Package requirements by OS family - explicit mappings
_facts_required_packages:
    Debian:
        - curl
        - jq
        - bc
    # RedHat ships curl-minimal preinstalled; pulling the full `curl`
    # package conflicts with it ("curl-minimal conflicts with curl") and
    # aborts the transaction. curl-minimal already provides the binary the
    # fact scripts use, so it is omitted here.
    RedHat:
        - jq
        - bc
    Suse:
        - curl
        - jq
        - bc
    Alpine:
        - curl
        - jq
        - bc
    default:
        - curl
        - jq
        - bc

# Facts collection scripts to install
_facts_collection_scripts:
    - system.fact
    - cloud.fact
    - run.fact
    - security.fact
    - container.fact
    - network.fact
