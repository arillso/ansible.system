---
# Build the effective ruleset and render /etc/nftables.conf

- name: Apply hierarchical merge and generate final firewall configuration
  ansible.builtin.set_fact:
      _firewall_tables: >-
          {{ {
              'firewall_tables': firewall_tables | default([]),
              'firewall_global': firewall_global | default([]),
              'firewall_group': firewall_group | default([]),
              'firewall_host': firewall_host | default([])
          } | arillso.system.to_nftables_hierarchy }}

- name: Collect the tables this config manages
  ansible.builtin.set_fact:
      # "family name" per table; service.yml reuses it for ExecStop.
      _firewall_table_ids: >-
          {{ _firewall_tables | map(attribute='table.family')
             | zip(_firewall_tables | map(attribute='table.name'))
             | map('join', ' ') | list }}

# The previous config names the tables the last run managed. Tables no
# longer in the YAML are deleted by the new config instead of staying in
# the kernel.
- name: Read previous nftables.conf
  ansible.builtin.slurp:
      src: /etc/nftables.conf
  register: _firewall_previous_conf
  failed_when: false
  become: true

# Only `table ... {` definitions match; the template writes its reset lines
# as `add table`, so a removed table is deleted once and then dropped.
- name: Collect tables to reset
  ansible.builtin.set_fact:
      _firewall_reset_tables: >-
          {{ (_firewall_previous_conf.content | default('') | b64decode
              | regex_findall('(?m)^table ([^ ]+ [^ ]+) [{]'))
             | union(_firewall_table_ids) }}

# Validate before install: a broken file would otherwise replace a working
# one and fail to load.
- name: Generate nftables.conf from hierarchical YAML structure
  ansible.builtin.template:
      src: etc/nftables.conf.j2
      dest: /etc/nftables.conf
      mode: "0644"
      owner: root
      group: root
      backup: true
      validate: /usr/sbin/nft -c -f %s
  become: true
  notify: "firewall: reload"
