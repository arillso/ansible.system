---
# Build the effective ruleset and render /etc/nftables.conf

- name: Apply hierarchical merge and generate final firewall configuration
  ansible.builtin.set_fact:
      _firewall_tables: >-
          {{ {
              'firewall_tables': firewall_tables | default([]),
              'firewall_global': firewall_global | default([]),
              'firewall_group': firewall_group | default([]),
              'firewall_host': firewall_host | default([])
          } | arillso.system.to_nftables_hierarchy }}

- name: Collect the tables this config manages
  ansible.builtin.set_fact:
      # "family name" per table; service.yml reuses it for ExecStop.
      _firewall_table_ids: >-
          {{ _firewall_tables | map(attribute='table.family')
             | zip(_firewall_tables | map(attribute='table.name'))
             | map('join', ' ') | list }}

# /etc/nftables.managed lists the tables the last successful reload loaded;
# the reload handler writes it. Tables listed there but gone from the YAML
# are deleted by the new config. Before the first reload with this file
# (fresh host, upgrade) the previous nftables.conf stands in.
- name: Read managed table list
  ansible.builtin.slurp:
      src: /etc/nftables.managed
  register: _firewall_managed_file
  failed_when: false
  become: true

- name: Read previous nftables.conf
  ansible.builtin.slurp:
      src: /etc/nftables.conf
  register: _firewall_previous_conf
  failed_when: false
  become: true
  when: _firewall_managed_file.content is not defined

- name: Collect tables the last reload loaded
  ansible.builtin.set_fact:
      _firewall_managed_tables: >-
          {{ (_firewall_managed_file.content | b64decode).splitlines() | select | list
             if _firewall_managed_file.content is defined
             else (_firewall_previous_conf.content | default('') | b64decode
                   | regex_findall('(?m)^table ([^ ]+ [^ ]+) [{]')) }}

- name: Collect tables to reset
  ansible.builtin.set_fact:
      _firewall_reset_tables: >-
          {{ (_firewall_managed_tables | default([])) | union(_firewall_table_ids) }}

# Validate before install: a broken file would otherwise replace a working
# one and fail to load.
- name: Generate nftables.conf from hierarchical YAML structure
  ansible.builtin.template:
      src: etc/nftables.conf.j2
      dest: /etc/nftables.conf
      mode: "0644"
      owner: root
      group: root
      backup: true
      validate: /usr/sbin/nft -c -f %s
  become: true
  notify: "firewall: reload"

# A failed reload leaves the managed list behind the YAML while the file on
# disk is already current, so the template alone would not notify again.
- name: Reload until a reload has loaded the current tables
  ansible.builtin.debug:
      msg: "Last loaded tables {{ _firewall_managed_tables }} differ from {{ _firewall_table_ids }}"
  changed_when: true
  notify: "firewall: reload"
  when:
      - _firewall_managed_file.content is defined
      - _firewall_managed_tables | sort != _firewall_table_ids | sort
