---
# systemd unit override and service state for nftables

- name: Gather service facts to check for tailscaled
  ansible.builtin.service_facts:
  when: ansible_facts.services is not defined

- name: Check if tailscaled service exists
  ansible.builtin.set_fact:
      _firewall_tailscale_exists: >-
          {{ 'tailscaled.service' in ansible_facts.get('services', {}) }}

- name: Deploy nftables systemd override via systemd role
  ansible.builtin.include_role:
      name: arillso.system.systemd
      tasks_from: unit
  vars:
      # Stop deletes only the tables this role manages, not the whole
      # ruleset: `nft flush ruleset` would also wipe Docker's and
      # kube-proxy's tables. Deleting (not flushing) removes the
      # `policy drop` base chains, so a stopped firewall really is open.
      # The leading "" resets the distro's ExecStart/ExecReload/ExecStop,
      # which would otherwise run before ours (EL's ExecReload flushes the
      # whole ruleset). The "-" prefix ignores a table that does not exist.
      _firewall_execstop_cmds: >-
          {{ [''] + (_firewall_tables | default([])
                     | map(attribute='table.family')
                     | zip(_firewall_tables | default([]) | map(attribute='table.name'))
                     | map('join', ' ')
                     | map('regex_replace', '^', '-/usr/sbin/nft delete table ')
                     | list) }}
      # Unit dict is built from a static base plus the Tailscale
      # ordering deps if and only if the service is present. Keeps
      # the include_role single (Audit M5) and avoids the 50-line
      # copy/paste of the previous two branches.
      _firewall_unit_base:
          Unit:
              Description: nftables firewall with enhanced configuration
              Documentation: https://wiki.nftables.org/
          Service:
              Type: oneshot
              RemainAfterExit: "yes"
              ExecStart:
                  - ""
                  - /usr/sbin/nft -f /etc/nftables.conf
              ExecReload:
                  - ""
                  - /usr/sbin/nft -f /etc/nftables.conf
              ExecStop: "{{ _firewall_execstop_cmds }}"
          Install:
              WantedBy: multi-user.target
      _firewall_unit_tailscale_overlay:
          Unit:
              After: ["tailscaled.service"]
              Wants: ["tailscaled.service"]
      _firewall_unit: >-
          {{ _firewall_unit_base | combine(
                 _firewall_tailscale_exists | bool
                 | ternary(_firewall_unit_tailscale_overlay, {}),
                 recursive=true) }}
      systemd_unit_path: /etc/systemd/system/nftables.service.d
      systemd_units:
          - name: override.conf
            state: present
            unit: "{{ _firewall_unit }}"

- name: Enable and start nftables service via systemd role
  ansible.builtin.include_role:
      name: arillso.system.systemd
      tasks_from: service
  vars:
      systemd_services:
          - name: nftables
            enabled: true
            state: started
            daemon_reload: true
