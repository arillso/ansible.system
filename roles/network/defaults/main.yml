---
# Entry Point Controls
network_resolv_enabled: true
network_netplan_enabled: false

# DNS Configuration
# network_dns_nameservers, network_dns_search and network_dns_domain apply to
# both paths. With systemd-resolved they fill DNS= and Domains= unless
# network_resolved_dns / network_resolved_domains are set.
network_dns_nameservers: []
# Example:
# network_dns_nameservers:
#   - 8.8.8.8
#   - 8.8.4.4
#   - 1.1.1.1

network_dns_search: []
# Example:
# network_dns_search:
#   - example.com
#   - local.example.com

network_dns_domain: ""
# Only used for a traditional /etc/resolv.conf; systemd-resolved has no
# equivalent for resolver options.
network_dns_options: []
# Example:
# network_dns_options:
#   - timeout:2
#   - attempts:3
#   - rotate
#   - ndots:1

# Systemd-resolved configuration
network_use_systemd_resolved: true
# Overrides network_dns_nameservers for resolved.conf when non-empty.
network_resolved_dns: []
network_resolved_fallback_dns:
    - 8.8.8.8
    - 8.8.4.4
# Overrides network_dns_domain + network_dns_search when non-empty.
network_resolved_domains: []
# LLMNR and mDNS answer name queries from anyone on the link; off for servers.
network_resolved_llmnr: "no"
network_resolved_multicast_dns: "no"
network_resolved_dnssec: "allow-downgrade"
network_resolved_dns_over_tls: "no"
network_resolved_cache: "yes"
# Any boolean false ("no", "false", "0", "off", ...) links /etc/resolv.conf to the full resolver list
# (/run/systemd/resolve/resolv.conf) instead of the 127.0.0.53 stub.
network_resolved_dnsstublistener: "yes"
# Writes dns=systemd-resolved to /etc/NetworkManager/conf.d when NetworkManager
# is installed. Set to false to keep NetworkManager's own DNS mode (dnsmasq,
# none, default).
network_resolved_manage_networkmanager: true

# Netplan Configuration
network_netplan_config: {}
# Example:
# network_netplan_config:
#   network:
#     version: 2
#     renderer: networkd
#     ethernets:
#       eth0:
#         dhcp4: true
#         dhcp6: false
#       eth1:
#         addresses:
#           - 192.168.1.10/24
#         routes:
#           - to: default
#             via: 192.168.1.1
#         nameservers:
#           addresses:
#             - 8.8.8.8
#             - 8.8.4.4

network_netplan_filename: 01-netcfg.yaml
# netplan apply only runs when the file changes in the same run.
network_netplan_apply: false

# Service Management
# Master switch for the role's handlers (systemd-resolved, NetworkManager).
network_restart_services: true
# With a restart disabled, a changed resolved.conf (including the stub
# listener and the /etc/resolv.conf link) takes effect only after a manual
# `systemctl restart systemd-resolved`.
network_systemd_resolved_restart: true

# Retry Configuration
network_retry_count: 3
network_retry_delay: 5

# Validation and Safety
network_backup_configs: true
network_validate_netplan: true
