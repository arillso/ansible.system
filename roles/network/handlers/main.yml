---
- name: Restart systemd-resolved to apply DNS resolver changes
  ansible.builtin.systemd:
      name: systemd-resolved
      state: restarted
  become: true
  when:
      - network_restart_services | bool
      - network_systemd_resolved_restart | bool
  listen: "network: restart resolved"

- name: Reload NetworkManager to apply DNS mode changes
  ansible.builtin.systemd:
      name: NetworkManager
      state: reloaded
  become: true
  when: network_restart_services | bool
  listen: "network: reload NetworkManager"
