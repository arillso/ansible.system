---
- name: Configure systemd-resolved
  when: network_use_systemd_resolved | default(true) | bool
  block:
      - name: Deploy systemd-resolved configuration
        ansible.builtin.template:
            src: etc/systemd/resolved.conf.j2
            dest: /etc/systemd/resolved.conf
            owner: root
            group: root
            mode: "0644"
            backup: "{{ network_backup_configs }}"
        become: true
        notify: "network: restart resolved"
        retries: "{{ network_retry_count }}"
        delay: "{{ network_retry_delay }}"
        register: _network_resolved_config
        until: _network_resolved_config is succeeded

      # Installed after the config is in place, so the package's first start
      # already uses it.
      - name: Install systemd-resolved package
        ansible.builtin.package:
            name: systemd-resolved
            state: present
        become: true
        retries: "{{ network_retry_count }}"
        delay: "{{ network_retry_delay }}"
        register: _network_resolved_install
        until: _network_resolved_install is succeeded
        when: _network_resolved_package | bool

      - name: Check whether NetworkManager is installed
        ansible.builtin.stat:
            path: /usr/sbin/NetworkManager
        register: _network_nm_binary

      # Without this, NetworkManager keeps its own DNS handling and never
      # passes per-link DNS servers to systemd-resolved.
      - name: Hand NetworkManager DNS over to systemd-resolved
        ansible.builtin.copy:
            content: |
                # {{ ansible_managed }}
                [main]
                dns=systemd-resolved
            dest: /etc/NetworkManager/conf.d/90-arillso-dns-resolved.conf
            owner: root
            group: root
            mode: "0644"
        become: true
        notify: "network: reload NetworkManager"
        when: _network_nm_binary.stat.exists

      - name: Ensure systemd-resolved is enabled and started via systemd role
        ansible.builtin.include_role:
            name: arillso.system.systemd
            tasks_from: service
        vars:
            systemd_services:
                - name: systemd-resolved
                  enabled: true
                  state: started

      - name: Link /etc/resolv.conf to systemd-resolved
        ansible.builtin.file:
            src: >-
                {{ '/run/systemd/resolve/resolv.conf'
                if _network_resolved_stub_disabled | bool
                else '/run/systemd/resolve/stub-resolv.conf' }}
            dest: /etc/resolv.conf
            state: link
            force: true
        become: true

- name: Configure traditional /etc/resolv.conf
  when: not (network_use_systemd_resolved | default(true) | bool)
  block:
      - name: Deploy resolv.conf
        ansible.builtin.template:
            src: etc/resolv.conf.j2
            dest: /etc/resolv.conf
            owner: root
            group: root
            mode: "0644"
            backup: "{{ network_backup_configs }}"
            # /etc/resolv.conf is frequently a bind-mount (containers) or a
            # symlink managed by another service, where Ansible's default
            # atomic write (write temp file + rename) fails with "Device or
            # resource busy". unsafe_writes falls back to an in-place write
            # so the resolver config still lands on those hosts.
            unsafe_writes: true
        become: true
        retries: "{{ network_retry_count }}"
        delay: "{{ network_retry_delay }}"
        register: _network_resolv_config
        until: _network_resolv_config is succeeded
