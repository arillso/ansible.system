---
# Internal variables for network role

# systemd accepts every boolean spelling for DNSStubListener.
_network_resolved_stub_disabled: >-
    {{ network_resolved_dnsstublistener | string | lower in ['no', 'false', '0', 'off'] }}

# Validates the candidate file together with the other netplan files inside a
# scratch root, so a rejected config never reaches /etc/netplan. Exits before
# any copy when mktemp fails, so an empty $root never points at /.
_network_netplan_validate_cmd: >-
    sh -c 'root=$(mktemp -d) || exit 1;
    for d in etc lib run; do mkdir -p "$root/$d/netplan";
    cp -p /$d/netplan/*.yaml "$root/$d/netplan/" 2>/dev/null; done;
    cp "$1" "$root/etc/netplan/$2" && netplan generate --root-dir "$root"; rc=$?;
    rm -rf "$root"; exit $rc' _ %s {{ network_netplan_filename | quote }}
