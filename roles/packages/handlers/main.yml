---
# cache.yml refreshes the index and resets the flags; this handler only covers
# entry points that skip cache.yml (e.g. tasks_from: repositories).
- name: Update apt cache after repository or signing key changes
  ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 0
  become: true
  listen: "packages: update cache"
  changed_when: false
  when: _packages_cache_stale | bool

# Runs after the update above (handlers run in definition order)
- name: Reset APT change flags after the cache update
  ansible.builtin.include_tasks: _cache_flags_reset.yml
  listen: "packages: update cache"

- name: Restart services listed in packages_services_to_restart
  ansible.builtin.systemd:
      name: "{{ item }}"
      state: restarted
  become: true
  loop: "{{ packages_services_to_restart | default([]) }}"
  listen: "packages: restart services"

- name: Reload systemd manager configuration after package unit changes
  ansible.builtin.systemd:
      daemon_reload: true
  become: true
  listen: "packages: daemon-reload"
