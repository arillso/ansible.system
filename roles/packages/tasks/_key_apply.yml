---
# Applies one entry from `packages_keys` to the host. The caller has
# already populated _pkg_key_item (the raw entry from packages_keys)
# and the normalised fields in _pkg_key (computed in keys.yml):
#
#   _pkg_key.dispatch    one of: url-direct, url-dearmor, keyserver, data
#   _pkg_key.keyring     absolute keyring path on the host
#   _pkg_key.label       short identifier for loop labels
#
# Each branch sets _pkg_key_changed: true when the host saw a write,
# so the caller can fold the flag back into packages_keys_changed.
#
# Container coverage is partial — the molecule packages scenario
# installs packages but does not exercise key import. Audit M4 was
# explicit that this refactor removes 7 duplicate task definitions
# at the cost of harder-to-test indirection.

- name: "Download key directly to host keyring ({{ _pkg_key.label }})"
  ansible.builtin.get_url:
      url: "{{ _pkg_key_item.url }}"
      dest: "{{ _pkg_key.keyring }}"
      mode: "0644"
      owner: root
      group: root
      force: "{{ packages_keys_force_update | bool }}"
      timeout: 30
  become: true
  when: _pkg_key.dispatch == 'url-direct'
  register: _packages_key_apply_get
  notify: "packages: update cache"

- name: "Stat target keyring before staging ({{ _pkg_key.label }})"
  ansible.builtin.stat:
      path: "{{ _pkg_key.keyring }}"
  when: _pkg_key.dispatch in ['url-dearmor', 'data']
  register: _packages_key_target_stat
  changed_when: false

# The block below cannot run in check mode (no tempfile), so report the
# pending keyring write here instead of a silent skip.
- name: "Report keyring that would be written ({{ _pkg_key.label }})"
  ansible.builtin.debug:
      msg: "{{ _pkg_key.keyring }} would be written"
  changed_when: true
  when:
      - ansible_check_mode
      - _pkg_key.dispatch in ['url-dearmor', 'data']
      - (not (_packages_key_target_stat.stat.exists | default(false)))
        or packages_keys_force_update

# The armored key is staged in a fresh mktemp file: a fixed /tmp path
# lets a local user plant a symlink that root then writes through.
- name: "Dearmor key into host keyring ({{ _pkg_key.label }})"
  when:
      - _pkg_key.dispatch in ['url-dearmor', 'data']
      - (not (_packages_key_target_stat.stat.exists | default(false)))
        or packages_keys_force_update
      # tempfile does not run in check mode, so there is no path to stage to
      - not ansible_check_mode
  become: true
  block:
      - name: "Create staging file for armored key ({{ _pkg_key.label }})"
        ansible.builtin.tempfile:
            state: file
            suffix: .asc
        register: _packages_key_staging

      - name: "Stage armored key from URL ({{ _pkg_key.label }})"
        ansible.builtin.get_url:
            url: "{{ _pkg_key_item.url }}"
            dest: "{{ _packages_key_staging.path }}"
            mode: "0600"
            force: true
            timeout: 30
        when: _pkg_key.dispatch == 'url-dearmor'

      - name: "Stage armored key from data ({{ _pkg_key.label }})"
        ansible.builtin.copy:
            content: "{{ _pkg_key_item.data | default('') }}"
            dest: "{{ _packages_key_staging.path }}"
            mode: "0600"
        when: _pkg_key.dispatch == 'data'

      - name: "Dearmor staged key into host keyring ({{ _pkg_key.label }})"
        ansible.builtin.command:
            argv:
                - gpg
                - --batch
                - --yes
                - --dearmor
                - -o
                - "{{ _pkg_key.keyring }}"
                - "{{ _packages_key_staging.path }}"
        register: _packages_key_apply_dearmor
        notify: "packages: update cache"
        # the block only runs when the keyring is missing or forced
        changed_when: true
  always:
      - name: "Remove staging file ({{ _pkg_key.label }})"
        ansible.builtin.file:
            path: "{{ _packages_key_staging.path }}"
            state: absent
        when: _packages_key_staging.path is defined

- name: "Fetch key from keyserver into host keyring ({{ _pkg_key.label }})"
  vars:
      _keyring: "{{ _pkg_key.keyring }}"
  ansible.builtin.shell:
      cmd: |
          set -e
          _tmpfile=$(mktemp --suffix=.gpg)
          trap 'rm -f "$_tmpfile" "${_tmpfile}~"' EXIT
          gpg --no-default-keyring --keyring "$_tmpfile" \
              --keyserver {{ _pkg_key_item.keyserver | quote }} \
              --recv-keys {{ _pkg_key_item.id | quote }}
          gpg --no-default-keyring --keyring "$_tmpfile" \
              --export {{ _pkg_key_item.id | quote }} > {{ _keyring | quote }}
      executable: /bin/bash
      creates: "{{ _keyring }}"
  become: true
  when: _pkg_key.dispatch == 'keyserver'
  register: _packages_key_apply_keyserver
  notify: "packages: update cache"

- name: "Normalise keyring permissions ({{ _pkg_key.label }})"
  ansible.builtin.file:
      path: "{{ _pkg_key.keyring }}"
      mode: "0644"
      owner: root
      group: root
  become: true
  when:
      - _pkg_key.dispatch in ['url-direct', 'url-dearmor', 'keyserver', 'data']
      - (_packages_key_apply_get is changed | default(false))
        or (_packages_key_apply_dearmor is changed | default(false))
        or (_packages_key_apply_keyserver is changed | default(false))

- name: "Track that a key was applied ({{ _pkg_key.label }})"
  ansible.builtin.set_fact:
      packages_keys_changed: true
  when:
      - (_packages_key_apply_get is changed | default(false))
        or (_packages_key_apply_dearmor is changed | default(false))
        or (_packages_key_apply_keyserver is changed | default(false))
