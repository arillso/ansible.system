---
# The apt module checks the cache age against update-success-stamp. Without
# the stamp it would fall back to the lists directory mtime, which is fresh
# right after `rm -rf /var/lib/apt/lists/*`, so a missing stamp forces a
# refresh. Any repository, key or APT configuration change does too. A failed update
# fails the play, including NO_PUBKEY: installing against a stale index
# hides the broken repository.
- name: Check APT update stamp
  ansible.builtin.stat:
      path: /var/lib/apt/periodic/update-success-stamp
  register: _packages_apt_stamp

- name: Update APT cache
  ansible.builtin.apt:
      update_cache: true
      cache_valid_time: >-
          {{ 0 if (packages_force_cache_update
                   or not _packages_apt_stamp.stat.exists
                   or _packages_cache_stale | bool)
             else packages_cache_valid_time | int }}
  become: true
  register: _packages_cache_updated
  retries: "{{ packages_cache_update_retries }}"
  delay: "{{ packages_cache_update_delay }}"
  until: _packages_cache_updated is succeeded
  changed_when: false

# apt only writes this stamp through an optional Post-Invoke hook
# (update-notifier-common); without it every run would refresh.
- name: Record the successful cache update
  ansible.builtin.file:
      path: /var/lib/apt/periodic/update-success-stamp
      state: touch
      mode: "0644"
  become: true
  when: _packages_cache_updated.cache_updated | default(false)
  changed_when: false

- name: Reset change flags
  ansible.builtin.include_tasks: _cache_flags_reset.yml
