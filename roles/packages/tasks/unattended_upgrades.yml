---
# An unquoted 1.20 is the float 1.2; its pin would match no version while
# `version *` blocks all of them. Integers such as 15 are safe.
- name: Check that version pins are not floats
  ansible.builtin.assert:
      that: packages_unattended_upgrades_version_pins.values() | select('float') | list | length == 0
      fail_msg: 'Quote decimal versions in packages_unattended_upgrades_version_pins, e.g. nginx: "1.20"'
      quiet: true
  when: packages_unattended_upgrades_install

- name: Install unattended-upgrades package
  ansible.builtin.apt:
      name: unattended-upgrades
      state: present
      update_cache: false
  become: true
  retries: "{{ packages_retry_count }}"
  delay: "{{ packages_retry_delay }}"
  register: _packages_unattended_install
  until: _packages_unattended_install is succeeded
  when: packages_unattended_upgrades_install

- name: Configure unattended-upgrades
  when: packages_unattended_upgrades_install
  block:
      - name: Generate APT preferences for version pinning
        ansible.builtin.template:
            src: etc/apt/preferences.d/unattended-upgrades-pins.j2
            dest: /etc/apt/preferences.d/99unattended-upgrades-pins
            owner: root
            group: root
            mode: "0644"
        become: true
        when: packages_unattended_upgrades_version_pins | length > 0

      - name: Remove APT preferences if no pins configured
        ansible.builtin.file:
            path: /etc/apt/preferences.d/99unattended-upgrades-pins
            state: absent
        become: true
        when: packages_unattended_upgrades_version_pins | length == 0

      - name: Configure unattended-upgrades main settings
        ansible.builtin.template:
            src: etc/apt/apt.conf.d/50unattended-upgrades.j2
            dest: /etc/apt/apt.conf.d/50unattended-upgrades
            owner: root
            group: root
            mode: "0644"
            backup: true
        become: true

      - name: Configure auto-updates settings
        ansible.builtin.template:
            src: etc/apt/apt.conf.d/20auto-upgrades.j2
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            owner: root
            group: root
            mode: "0644"
            backup: true
        become: true

      - name: Create systemd timer override directory
        ansible.builtin.file:
            path: /etc/systemd/system/apt-daily-upgrade.timer.d
            state: directory
            owner: root
            group: root
            mode: "0755"
        become: true

      - name: Configure unattended-upgrades timer
        ansible.builtin.template:
            src: etc/systemd/system/apt-daily-upgrade.timer.d/override.conf.j2
            dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
            owner: root
            group: root
            mode: "0644"
        become: true
        notify: "packages: daemon-reload"
        when: packages_unattended_upgrades_timer_enabled

      - name: Remove timer override if disabled
        ansible.builtin.file:
            path: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
            state: absent
        become: true
        notify: "packages: daemon-reload"
        when: not packages_unattended_upgrades_timer_enabled

      - name: Enable and start unattended-upgrades services via systemd role
        ansible.builtin.include_role:
            name: arillso.system.systemd
            tasks_from: service
        vars:
            systemd_services:
                - name: unattended-upgrades
                  enabled: true
                  state: started
                  daemon_reload: true
                - name: apt-daily-upgrade.timer
                  enabled: true
                  state: started
                  daemon_reload: true

- name: Remove unattended-upgrades configuration
  when: not packages_unattended_upgrades_install
  block:
      # The unit is missing on hosts that never had the package; stopping
      # a missing unit fails inside the systemd role, so look first.
      - name: Check whether the unattended-upgrades unit exists
        ansible.builtin.command:
            cmd: systemctl list-unit-files --no-legend unattended-upgrades.service
        register: _packages_unattended_unit
        changed_when: false
        failed_when: false
        check_mode: false

      - name: Stop and disable unattended-upgrades service via systemd role
        ansible.builtin.include_role:
            name: arillso.system.systemd
            tasks_from: service
        vars:
            systemd_services:
                - name: unattended-upgrades
                  enabled: false
                  state: stopped
        when: _packages_unattended_unit.stdout | trim | length > 0

      - name: Remove unattended-upgrades configuration files
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        become: true
        loop:
            - /etc/apt/apt.conf.d/50unattended-upgrades
            - /etc/apt/apt.conf.d/20auto-upgrades
            - /etc/apt/preferences.d/99unattended-upgrades-pins

      # Removed last: the stop above needs the unit file the package ships.
      - name: Remove unattended-upgrades package
        ansible.builtin.apt:
            name: unattended-upgrades
            state: absent
        become: true
        retries: "{{ packages_retry_count }}"
        delay: "{{ packages_retry_delay }}"
        register: _packages_unattended_remove
        until: _packages_unattended_remove is succeeded
