---
# Argument specifications for System Ready role
# Defines and validates all input parameters for the role

argument_specs:
    main:
        short_description: "Wait for system readiness before configuration"
        description: |
            This role waits until the host accepts an Ansible connection and
            cloud-init has finished. A reboot triggered by cloud-init is
            handled once. Run it in a play with `gather_facts: false`.
        options:
            ready_ssh_delay:
                type: "int"
                required: false
                default: 10
                description: |
                    Delay in seconds before the first connection attempt,
                    before and after a reboot triggered by cloud-init

            ready_ssh_timeout:
                type: "int"
                required: false
                default: 300
                description: |
                    Maximum time in seconds to wait for a working connection,
                    before and after a reboot triggered by cloud-init

            ready_cloud_init_timeout:
                type: "int"
                required: false
                default: 900
                description: |
                    Maximum time in seconds for each `cloud-init status --wait`
                    (applies again after a reboot, so the worst case is twice
                    this plus the connection waits).
                    Skipped on hosts without /run/cloud-init.

            ready_gather_facts:
                type: "bool"
                required: false
                default: true
                description: "Gather system facts after system is ready"

            ready_gather_subset:
                type: "list"
                elements: "str"
                required: false
                default: []
                description: |
                    Subset of facts to gather. Example:
                    ['!all', 'network', 'hardware']
                    Empty list for full fact gathering.
