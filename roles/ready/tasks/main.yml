---
# Wait for system readiness: a working Ansible connection, then cloud-init.

- name: Wait for the connection
  ansible.builtin.wait_for_connection:
      delay: "{{ ready_ssh_delay }}"
      timeout: "{{ ready_ssh_timeout }}"

- name: Check whether cloud-init is present
  ansible.builtin.stat:
      path: /run/cloud-init
  register: _ready_cloud_init_dir

- name: Wait for cloud-init
  when: _ready_cloud_init_dir.stat.exists
  block:
      # A reboot during the cloud-init run (e.g. package_reboot_if_required)
      # drops the connection. That is an unreachable result, which neither
      # `rescue` nor `until`/`retries` catch, so the first wait ignores it and
      # the wait is repeated once the host is back. A skipped include leaves
      # `_ready_cloud_init` untouched, unlike a skipped task with `register`.
      # ponytail: one reboot during the run; a `power_state` reboot after
      # cloud-init reports done is not detected (would need a boot_id check).
      - name: Wait for cloud-init
        ansible.builtin.include_tasks:
            file: cloud_init.yml
            apply:
                ignore_unreachable: true

      - name: Wait for the connection after a reboot
        ansible.builtin.wait_for_connection:
            delay: "{{ ready_ssh_delay }}"
            timeout: "{{ ready_ssh_timeout }}"
        # Skipped in --check otherwise, while the next wait still runs.
        check_mode: false
        when: _ready_cloud_init is unreachable

      - name: Wait for cloud-init after a reboot
        ansible.builtin.include_tasks:
            file: cloud_init.yml
        when: _ready_cloud_init is unreachable

- name: Gather system facts
  ansible.builtin.setup:
      gather_subset: "{{ ready_gather_subset if ready_gather_subset | length > 0 else omit }}"
  when: ready_gather_facts | bool
