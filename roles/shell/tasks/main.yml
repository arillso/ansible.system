---
- name: "Create profile.d directory"
  ansible.builtin.file:
      path: /etc/profile.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  tags:
      - shell
      - directories

- name: "Install shell utility packages"
  ansible.builtin.package:
      name: "{{ _shell_required_packages[ansible_facts['os_family']] | default(_shell_required_packages['default']) }}"
      state: present
  become: true
  when: shell_motd_style == 'figlet'
  # figlet/toilet etc. are optional cosmetic packages for the MOTD
  # style. If the host's package repo doesn't carry them, the role
  # falls back to the standard style rather than aborting.
  failed_when: false
  register: _shell_package_install
  tags:
      - shell
      - packages

# Outside motd.yml, so hosts with the MOTD disabled lose the old cron job too
- name: "Check for the system status script from earlier versions"
  ansible.builtin.stat:
      path: /usr/local/bin/system-status-precompute.sh
  register: _shell_precompute_script
  tags:
      - shell
      - cleanup

# Only where the old script exists, so hosts without crontab are not touched.
- name: "Remove system status cron job from earlier versions"
  ansible.builtin.cron:
      name: "system-status-precompute"
      user: root
      state: absent
  become: true
  when: _shell_precompute_script.stat.exists
  tags:
      - shell
      - cleanup

- name: "Remove files from earlier versions"
  ansible.builtin.file:
      path: "{{ item }}"
      state: absent
  become: true
  loop: "{{ _shell_obsolete_files }}"
  tags:
      - shell
      - cleanup

# Include modular components
- name: "Configure MOTD system"
  ansible.builtin.include_tasks: motd.yml
  when: shell_motd_enabled
  tags:
      - shell
      - motd

- name: "Configure SSH banners"
  ansible.builtin.include_tasks: ssh_banner.yml
  when: shell_ssh_banner_enabled
  tags:
      - shell
      - ssh
      - banner

- name: "Configure shell environment"
  ansible.builtin.include_tasks: shell.yml
  when: shell_enabled
  tags:
      - shell
      - environment

- name: "Configure terminal settings"
  ansible.builtin.include_tasks: terminal.yml
  when: shell_terminal_colors_enabled or shell_terminal_completion_enabled
  tags:
      - shell
      - terminal
