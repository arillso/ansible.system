---
# MOTD configuration - Message of the Day setup and management

- name: "Install jq for the MOTD scripts"
  ansible.builtin.package:
      name: jq
      state: present
  become: true
  tags:
      - motd
      - packages

- name: "Create update-motd.d directory"
  ansible.builtin.file:
      path: /etc/update-motd.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
      - motd

- name: "Install dynamic MOTD scripts"
  ansible.builtin.template:
      src: "etc/update-motd.d/{{ item.key }}.j2"
      dest: "/etc/update-motd.d/{{ item.key }}"
      mode: "0755"
      owner: root
      group: root
  become: true
  loop: "{{ _shell_motd_scripts | dict2items | selectattr('value') | list }}"
  loop_control:
      label: "{{ item.key }}"
  when: ansible_facts['os_family'] == "Debian"
  tags:
      - motd

- name: "Remove disabled dynamic MOTD scripts"
  ansible.builtin.file:
      path: "/etc/update-motd.d/{{ item.key }}"
      state: absent
  become: true
  loop: "{{ _shell_motd_scripts | dict2items | rejectattr('value') | list }}"
  loop_control:
      label: "{{ item.key }}"
  when: ansible_facts['os_family'] == "Debian"
  tags:
      - motd

- name: "Create static MOTD file"
  ansible.builtin.template:
      src: etc/motd.j2
      dest: /etc/motd
      mode: "0644"
      owner: root
      group: root
  become: true
  tags:
      - motd

- name: "Remove unwanted default MOTD scripts"
  ansible.builtin.file:
      path: "{{ item }}"
      state: absent
  become: true
  loop: "{{ _shell_unwanted_motd_scripts }}"
  when: ansible_facts['os_family'] == "Debian"
  tags:
      - motd
      - cleanup
