---
# SSH banner configuration - Pre-authentication security notices

- name: "Create SSH banner file"
  ansible.builtin.template:
      src: etc/issue.net.j2
      dest: /etc/issue.net
      mode: "0644"
      owner: root
      group: root
  become: true
  register: _shell_ssh_banner_result
  failed_when:
      - _shell_ssh_banner_result.failed is defined
      - _shell_ssh_banner_result.failed
      - not shell_ignore_template_errors
  tags:
      - ssh
      - banner

- name: "Check for the sshd drop-in directory"
  ansible.builtin.stat:
      path: /etc/ssh/sshd_config.d
  register: _shell_sshd_dropin_dir
  tags:
      - ssh
      - config

# A drop-in instead of editing sshd_config, which the access role renders as a
# whole. Hosts without sshd_config.d (EL 8, OpenSSH < 8.2) get no Banner line.
- name: "Configure SSH banner drop-in"
  ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/50-arillso-shell-banner.conf
      content: "# Managed by Ansible (arillso.system.shell)\nBanner /etc/issue.net\n"
      mode: "0644"
      owner: root
      group: root
  become: true
  when: _shell_sshd_dropin_dir.stat.isdir | default(false)
  register: _shell_banner_dropin
  notify: "shell: restart ssh"
  tags:
      - ssh
      - config

- name: "Remove Banner line written to sshd_config by earlier versions"
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      line: "Banner /etc/issue.net"
      state: absent
  become: true
  when: _shell_sshd_dropin_dir.stat.isdir | default(false)
  register: _shell_banner_legacy_line
  notify: "shell: restart ssh"
  tags:
      - ssh
      - config

# Only after a change, so an unrelated sshd problem does not fail every run.
- name: "Verify SSH configuration is valid"
  ansible.builtin.command:
      cmd: sshd -t
  become: true
  changed_when: false
  check_mode: false
  when: >-
      (_shell_banner_dropin | default({})) is changed
      or (_shell_banner_legacy_line | default({})) is changed
  tags:
      - ssh
      - validation
