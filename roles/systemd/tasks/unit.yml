---
- name: Validate systemd unit definitions
  ansible.builtin.assert:
      that:
          - (_systemd_unit_item.content is defined) != (_systemd_unit_item.unit is defined)
          - >-
              _systemd_unit_item.unit is not defined
              or (_systemd_unit_item.unit is mapping
                  and _systemd_unit_item.unit.values() | reject('mapping') | list | length == 0
                  and _systemd_unit_item.unit.values() | map('dict2items') | flatten
                      | map(attribute='value') | select('mapping') | list | length == 0)
      fail_msg: >-
          {{ _systemd_unit_item.name }}: set exactly one of content or unit; unit must map
          section names to mappings of option values (string, number, list or null)
      quiet: true
  loop: "{{ systemd_units }}"
  loop_control:
      loop_var: _systemd_unit_item
      label: "{{ _systemd_unit_item.name }}"
  when: _systemd_unit_item.state | default('present') == 'present'

- name: Ensure systemd unit destination directory exists
  ansible.builtin.file:
      path: "{{ systemd_unit_path }}"
      state: directory
      owner: "{{ systemd_unit_owner }}"
      group: "{{ systemd_unit_group }}"
      mode: "{{ systemd_unit_dir_mode }}"
  become: true

- name: Deploy systemd unit files (raw content)
  ansible.builtin.copy:
      content: "{{ _systemd_unit_item.content }}"
      dest: "{{ systemd_unit_path }}/{{ _systemd_unit_item.name }}"
      owner: "{{ systemd_unit_owner }}"
      group: "{{ systemd_unit_group }}"
      mode: "{{ systemd_unit_mode }}"
      backup: "{{ systemd_backup_units }}"
      validate: "{{ _systemd_validate_cmd if _systemd_unit_validate | bool else omit }}"
  become: true
  loop: "{{ systemd_units }}"
  loop_control:
      loop_var: _systemd_unit_item
      label: "{{ _systemd_unit_item.name }}"
  when:
      - _systemd_unit_item.state | default('present') == 'present'
      - _systemd_unit_item.content is defined
  register: _systemd_unit_copy_result

- name: Deploy systemd unit files (structured)
  ansible.builtin.template:
      src: etc/systemd/system/unit.j2
      dest: "{{ systemd_unit_path }}/{{ _systemd_unit_item.name }}"
      owner: "{{ systemd_unit_owner }}"
      group: "{{ systemd_unit_group }}"
      mode: "{{ systemd_unit_mode }}"
      backup: "{{ systemd_backup_units }}"
      validate: "{{ _systemd_validate_cmd if _systemd_unit_validate | bool else omit }}"
  become: true
  loop: "{{ systemd_units }}"
  loop_control:
      loop_var: _systemd_unit_item
      label: "{{ _systemd_unit_item.name }}"
  when:
      - _systemd_unit_item.state | default('present') == 'present'
      - _systemd_unit_item.unit is defined
  register: _systemd_unit_template_result

- name: Check which systemd unit files to remove exist
  ansible.builtin.stat:
      path: "{{ systemd_unit_path }}/{{ _systemd_unit_item.name }}"
  become: true
  loop: "{{ systemd_units | selectattr('state', 'defined') | selectattr('state', '==', 'absent') | list }}"
  loop_control:
      loop_var: _systemd_unit_item
      label: "{{ _systemd_unit_item.name }}"
  # Drop-ins (no unit suffix) and templates (foo@.service, cannot be stopped
  # without an instance) are left alone.
  when:
      - _systemd_unit_is_unit | bool
      - "'@.' not in _systemd_unit_item.name"
  register: _systemd_unit_absent_stat

# Stop and disable before the file goes, otherwise the process keeps running
# and the .wants/ symlink dangles.
- name: Stop and disable systemd units before removal
  ansible.builtin.systemd:
      name: "{{ _systemd_unit_stat._systemd_unit_item.name }}"
      state: stopped
      enabled: false
  become: true
  loop: "{{ _systemd_unit_absent_stat.results }}"
  loop_control:
      loop_var: _systemd_unit_stat
      label: "{{ _systemd_unit_stat._systemd_unit_item.name }}"
  when: _systemd_unit_stat.stat.exists | default(false)

- name: Remove systemd unit files
  ansible.builtin.file:
      path: "{{ systemd_unit_path }}/{{ _systemd_unit_item.name }}"
      state: absent
  become: true
  loop: "{{ systemd_units }}"
  loop_control:
      loop_var: _systemd_unit_item
      label: "{{ _systemd_unit_item.name }}"
  when: _systemd_unit_item.state | default('present') == 'absent'
  register: _systemd_unit_remove_result

# Reload here, not in a handler: service.yml runs next and must see the new units.
- name: Reload systemd manager configuration after unit file changes
  ansible.builtin.systemd:
      daemon_reload: true
  become: true
  when: >-
      _systemd_unit_copy_result is changed
      or _systemd_unit_template_result is changed
      or _systemd_unit_remove_result is changed
