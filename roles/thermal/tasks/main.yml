---
# Main tasks for thermal management role

- name: Install thermal management packages
  ansible.builtin.include_tasks: packages.yml
  when: thermal_enabled

- name: Detect sensors and load kernel modules
  ansible.builtin.include_tasks: sensors.yml
  when: thermal_enabled

- name: Configure thermald
  ansible.builtin.include_tasks: thermald.yml
  when: thermal_enabled

- name: Manage thermal services
  ansible.builtin.include_tasks: service.yml
  when: thermal_enabled
