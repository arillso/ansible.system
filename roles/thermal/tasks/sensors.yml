---
# Hardware sensor detection and coretemp kernel module setup

- name: Detect hardware sensors
  ansible.builtin.shell:
      # sensors-detect may append driver modules to /etc/modules; compare
      # the file before and after to report that as a change.
      cmd: |
          before=$(cksum /etc/modules 2>/dev/null)
          sensors-detect --auto
          rc=$?
          after=$(cksum /etc/modules 2>/dev/null)
          [ "$before" = "$after" ] || echo "THERMAL_MODULES_CHANGED"
          exit $rc
  become: true
  when: thermal_run_sensors_detect
  register: _thermal_sensors_detect_result
  changed_when: "'THERMAL_MODULES_CHANGED' in _thermal_sensors_detect_result.stdout"
  # A host without any sensor is not an error.
  failed_when:
      - _thermal_sensors_detect_result.rc != 0
      - "'no sensors were detected' not in _thermal_sensors_detect_result.stdout"

- name: Load coretemp kernel module
  community.general.modprobe:
      name: coretemp
      state: present
  become: true

- name: Ensure coretemp module loads on boot
  ansible.builtin.lineinfile:
      path: /etc/modules
      line: "coretemp"
      create: true
      mode: "0644"
  become: true
