---
# thermald configuration directory and configuration file

- name: Create thermald configuration directory
  ansible.builtin.file:
      path: /etc/thermald
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true

- name: Deploy thermald configuration
  ansible.builtin.template:
      src: thermal-conf.xml.j2
      dest: /etc/thermald/thermal-conf.xml
      mode: "0644"
      owner: root
      group: root
  become: true
  notify: "thermal: restart thermald"
