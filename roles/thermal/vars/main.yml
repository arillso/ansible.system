---
# thermald and the coretemp module only support Intel x86_64 CPUs.
_thermal_cpu_supported: >-
    {{ ansible_facts['architecture'] | default('') == 'x86_64'
       and 'GenuineIntel' in ansible_facts['processor'] | default([]) }}

# In check mode a fresh host has no thermald unit yet; the systemd module
# fails on a missing unit even in check mode.
_thermal_service_unavailable: >-
    {{ ansible_check_mode
       and 'thermald.service' not in ansible_facts['services'] | default({}) }}
