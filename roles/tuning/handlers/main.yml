# File: roles/system_tuning/handlers/main.yml
---
- name: Reload kernel sysctl parameters from /etc/sysctl.d/
  ansible.builtin.command: sysctl --system
  register: _tuning_sysctl_reload_result
  changed_when: true
  failed_when: _tuning_sysctl_reload_result.rc != 0
  listen: "tuning: reload sysctl"

- name: Regenerate GRUB configuration after kernel command-line change
  ansible.builtin.command: "{{ _tuning_grub_update_commands[ansible_facts['os_family']] }}"
  register: _tuning_grub_update_result
  changed_when: true
  failed_when: _tuning_grub_update_result.rc != 0
  when: ansible_facts['os_family'] in _tuning_grub_update_commands
  listen: "tuning: update grub"

- name: Reload udev to apply new device rules
  ansible.builtin.systemd:
      name: systemd-udevd
      state: reloaded
  register: _tuning_udev_reload_result
  listen: "tuning: reload udev"

- name: Reload systemd manager configuration after tuning unit changes
  ansible.builtin.systemd:
      daemon_reload: true
  register: _tuning_systemd_reload_result
  failed_when: _tuning_systemd_reload_result.failed
  listen: "tuning: reload systemd"

# `tuning: apply` is a bundle event that triggers both the network-tuning
# and disable-thp service handlers. Individual events
# (`tuning: apply network`, `tuning: apply thp`) remain available for
# callers that only need one of them.

- name: Enable and start network-tuning systemd service
  ansible.builtin.systemd:
      name: network-tuning
      enabled: true
      state: started
      daemon_reload: true
  register: _tuning_network_service_result
  listen:
      - "tuning: apply"
      - "tuning: apply network"

- name: Enable and start disable-thp systemd service
  ansible.builtin.systemd:
      name: disable-thp
      enabled: true
      state: started
      daemon_reload: true
  register: _tuning_thp_service_result
  listen:
      - "tuning: apply"
      - "tuning: apply thp"

- name: Restart cpufrequtils to apply tuning-driven CPU governor changes (Debian)
  ansible.builtin.systemd:
      name: cpufrequtils
      state: restarted
  register: _tuning_cpufreq_restart_result
  when: ansible_facts['os_family'] == "Debian"
  listen: "tuning: restart cpufrequtils"

- name: Restart cpupower to apply CPU governor changes (RedHat/Suse)
  ansible.builtin.systemd:
      name: cpupower
      state: restarted
  register: _tuning_cpupower_restart_result
  when: ansible_facts['os_family'] in ["RedHat", "Suse"]
  listen: "tuning: restart cpupower"
