---
# Argument specifications for System Tuning role
# Defines and validates all input parameters for the role

argument_specs:
    main:
        short_description: "Apply system performance tuning configurations"
        description: |
            This role configures system-level performance tuning including
            sysctl parameters, network tuning, I/O schedulers, CPU governors,
            and security limits for optimized server performance.
        options:
            tuning_sysctl_config:
                type: "dict"
                required: false
                description: >-
                    Dictionary of sysctl parameters for performance tuning.
                    Keys are sysctl parameter names (e.g. vm.dirty_ratio, net.core.rmem_max,
                    fs.file-max, kernel.pid_max). Values are the desired settings.
                    Default: 21 parameters for dirty page writeback, socket buffers and backlog,
                    TCP buffers with bbr congestion control, and file, PID and thread limits.
                    See defaults/main.yml for the full set of default parameters.

            tuning_network_sysctl_config:
                type: "dict"
                required: false
                default:
                    net.ipv4.tcp_window_scaling: 1
                    net.ipv4.tcp_timestamps: 1
                    net.ipv4.tcp_sack: 1
                    net.ipv4.tcp_moderate_rcvbuf: 1
                    net.ipv4.tcp_no_metrics_save: 1
                    net.ipv4.ip_local_port_range: "1024 65535"
                description: >-
                    Additional network-specific sysctl parameters.
                    Keys are sysctl parameter names (e.g. net.ipv4.tcp_window_scaling,
                    net.ipv4.tcp_timestamps, net.ipv4.ip_local_port_range).
                    See defaults/main.yml for the full set of default parameters.

            tuning_optional_sysctl_params:
                type: "list"
                required: false
                elements: "str"
                default: ["net.ipv4.tcp_congestion_control"]
                description: >-
                    Keys of tuning_sysctl_config that may fail on a host (missing
                    kernel module or knob). A failed key is reported and removed
                    from the drop-in file instead of failing the role.

            tuning_optional_network_sysctl_params:
                type: "list"
                required: false
                elements: "str"
                default: []
                description: "Same as tuning_optional_sysctl_params for tuning_network_sysctl_config"

            tuning_grub_cmdline_linux_append:
                type: "str"
                required: false
                default: "transparent_hugepage={{ tuning_transparent_hugepages }}"
                description: >-
                    Kernel parameters to add to GRUB_CMDLINE_LINUX. A parameter
                    whose key is already present is replaced. Empty string
                    leaves GRUB untouched.

            tuning_swap_swappiness:
                type: "int"
                required: false
                default: 10
                description: >-
                    Swappiness value (0-100, lower = less swap usage). Wins over a
                    vm.swappiness key in tuning_sysctl_config.

            tuning_swap_file_enabled:
                type: "bool"
                required: false
                default: false
                description: "Enable swap file creation"

            tuning_swap_file_path:
                type: "str"
                required: false
                default: "/swapfile"
                description: "Path to swap file"

            tuning_swap_file_size_mb:
                type: "int"
                required: false
                default: 2048
                description: "Swap file size in megabytes"

            tuning_swap_priority:
                type: "int"
                required: false
                default: 0
                description: |
                    Linux swap priority for /etc/fstab opts (pri=N).
                    Default 0 is backward-compatible (single backend).
                    Set >0 for multi-backend layouts (e.g. zram-first with
                    disk-swap as fallback at lower priority).

            tuning_io_scheduler:
                type: "str"
                required: false
                default: "auto"
                description: |
                    I/O scheduler for all selected devices. 'auto' uses none
                    for NVMe and mq-deadline for all other disks.

            tuning_io_scheduler_override:
                type: "str"
                required: false
                default: null
                description: "I/O scheduler that takes precedence over tuning_io_scheduler"

            tuning_io_scheduler_devices:
                type: "list"
                required: false
                default: []
                elements: "str"
                description: "Block device names to set the I/O scheduler on, e.g. sda or dm-0 (empty = all detected disks)"

            tuning_cpu_governor:
                type: "str"
                required: false
                default: "auto"
                description: |
                    CPU governor to use. 'auto' uses powersave on pstate
                    drivers and schedutil or ondemand otherwise.

            tuning_cpu_governor_override:
                type: "str"
                required: false
                default: null
                description: "CPU governor that takes precedence over tuning_cpu_governor"

            tuning_transparent_hugepages:
                type: "str"
                required: false
                default: "madvise"
                choices: ["always", "madvise", "never"]
                description: "Transparent Huge Pages configuration"

            tuning_tuned_profile:
                type: "str"
                required: false
                default: "balanced"
                description: "Tuned profile to apply"

            tuning_security_limits:
                type: "list"
                required: false
                elements: "dict"
                description: >-
                    List of security limit configurations.
                    Default: soft/hard nofile 32768/65536 and soft/hard nproc 16384/32768 for domain "*".
                    See defaults/main.yml for the full list.
                options:
                    domain:
                        type: "str"
                        required: true
                        description: "User or group domain (e.g., '*', '@group', 'user')"
                    type:
                        type: "str"
                        required: true
                        choices: ["soft", "hard"]
                        description: "Limit type (soft or hard)"
                    item:
                        type: "str"
                        required: true
                        description: "Resource item (e.g., nofile, nproc, memlock)"
                    value:
                        type: "int"
                        required: true
                        description: "Limit value"

            tuning_network_ring_buffers:
                type: "list"
                required: false
                default: []
                elements: "dict"
                description: "List of network interface ring buffer configurations"
                options:
                    interface:
                        type: "str"
                        required: true
                        description: "Network interface name (e.g., eth0, ens3)"
                    rx_buffer:
                        type: "int"
                        required: true
                        description: "Receive ring buffer size"
                    tx_buffer:
                        type: "int"
                        required: true
                        description: "Transmit ring buffer size"

            tuning_packages_list:
                type: "list"
                required: false
                elements: "str"
                description: >-
                    Package names required for tuning.
                    Default: the list for ansible_facts['os_family'] from vars/main.yml
                    (Debian, RedHat, Suse; sysstat, iotop, htop, tuned, ethtool, util-linux,
                    pciutils plus cpufrequtils on Debian and tuned-utils on RedHat), else an empty list.

            tuning_network_tuning_enabled:
                type: "bool"
                required: false
                default: true
                description: "Enable network-specific tuning"

            tuning_validate_settings:
                type: "bool"
                required: false
                default: true
                description: "Validate settings before applying"

            tuning_sysctl_file:
                type: "str"
                required: false
                default: "/etc/sysctl.d/99-tuning.conf"
                description: "Path to sysctl configuration file"

            tuning_network_sysctl_file:
                type: "str"
                required: false
                default: "/etc/sysctl.d/99-network-tuning.conf"
                description: "Path to network sysctl configuration file"
