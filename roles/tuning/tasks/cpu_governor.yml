---
# File: roles/system_tuning/tasks/cpu_governor.yml
# Configure CPU frequency governor with proper validation

- name: Install CPU frequency utilities
  ansible.builtin.package:
      name: "{{ 'cpufrequtils' if ansible_facts['os_family'] == 'Debian' else 'kernel-tools' }}"
      state: present
  become: true

- name: Create CPU frequency configuration
  block:
      - name: Create cpufreq configuration (Debian/Ubuntu)
        ansible.builtin.template:
            src: etc/default/cpufrequtils.j2
            dest: /etc/default/cpufrequtils
            mode: "0644"
            owner: root
            group: root
            backup: true
        become: true
        notify: "tuning: restart cpufrequtils"
        when: ansible_facts['os_family'] == "Debian"

      - name: Create cpupower configuration (RedHat/CentOS)
        ansible.builtin.template:
            src: etc/sysconfig/cpupower.j2
            dest: /etc/sysconfig/cpupower
            mode: "0644"
            owner: root
            group: root
            backup: true
        become: true
        notify: "tuning: restart cpupower"
        when: ansible_facts['os_family'] in ["RedHat", "Suse"]

- name: Apply CPU governor immediately
  block:
      - name: Get list of CPU cores
        ansible.builtin.find:
            paths: /sys/devices/system/cpu
            patterns: "cpu[0-9]*"
            file_type: directory
        register: _tuning_cpu_cores

      - name: Check current CPU governor
        ansible.builtin.slurp:
            src: "{{ item.path }}/cpufreq/scaling_governor"
        register: _tuning_current_governor
        failed_when: false
        loop: "{{ _tuning_cpu_cores.files }}"
        when: _tuning_cpu_cores.files is defined

      # Best-effort immediate apply per CPU. Persistence comes from the
      # cpufreq/cpupower service enabled below. The `Validate CPU
      # governor was applied` assert in the verify block is the real
      # gate — if both immediate apply and service failed, the assert
      # fires and the role bails out.
      - name: Set CPU governor immediately
        ansible.builtin.copy:
            content: "{{ _tuning_final_cpu_governor }}"
            dest: "{{ item.item.path }}/cpufreq/scaling_governor"
            mode: "0644"
        become: true
        register: _tuning_governor_result
        failed_when: false
        changed_when: _tuning_governor_result.rc is defined and _tuning_governor_result.rc == 0
        when:
            - not item.failed
            - (item.content | b64decode | trim) != _tuning_final_cpu_governor
        loop: "{{ _tuning_current_governor.results }}"

      - name: Report CPU governor configuration status
        ansible.builtin.debug:
            msg: >-
                CPU {{ item.item.path | basename }}:
                {% if item.failed -%}
                Could not access governor settings{%- else -%}
                Current governor: {{ item.content | b64decode | trim }}{%- endif %}
        loop: "{{ _tuning_current_governor.results | default([]) }}"
        when: _tuning_current_governor.results is defined and _tuning_current_governor.results | length > 0

- name: Verify CPU governor configuration
  block:
      - name: Read final CPU governor settings
        ansible.builtin.slurp:
            src: "{{ item.path }}/cpufreq/scaling_governor"
        register: _tuning_final_governor
        failed_when: false
        loop: "{{ _tuning_cpu_cores.files }}"
        when: _tuning_cpu_cores.files is defined

      - name: Validate CPU governor was applied
        ansible.builtin.assert:
            that:
                - not item.failed
                - (item.content | b64decode | trim) == _tuning_final_cpu_governor
            fail_msg: "Failed to set CPU governor {{ _tuning_final_cpu_governor }} for {{ item.item.path | basename }}"
            success_msg: "CPU governor {{ _tuning_final_cpu_governor }} successfully applied to {{ item.item.path | basename }}"
        loop: "{{ _tuning_final_governor.results }}"
        when:
            - not ansible_check_mode
            - _tuning_final_governor.results is defined

- name: Enable CPU frequency service
  ansible.builtin.systemd:
      name: "{{ _tuning_service_commands[ansible_facts['os_family']]['cpufreq'] }}"
      enabled: true
      state: started
  become: true
  when: ansible_facts['os_family'] in _tuning_service_commands
