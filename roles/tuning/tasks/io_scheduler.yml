---
# File: roles/system_tuning/tasks/io_scheduler.yml
# Configure I/O scheduler settings with proper validation

- name: Create udev rules directory
  ansible.builtin.file:
      path: /etc/udev/rules.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true

- name: Configure I/O scheduler via udev rule
  ansible.builtin.template:
      src: etc/udev/rules.d/60-io-scheduler.rules.j2
      dest: /etc/udev/rules.d/60-io-scheduler.rules
      mode: "0644"
      owner: root
      group: root
      backup: true
  become: true
  notify: "tuning: reload udev"
  when: _tuning_optimized_storage_devices is defined and _tuning_optimized_storage_devices | length > 0

- name: Apply I/O scheduler immediately for each device
  block:
      - name: Check current I/O scheduler
        ansible.builtin.slurp:
            src: "/sys/block/{{ item.name }}/queue/scheduler"
        register: _tuning_current_scheduler
        failed_when: false
        loop: "{{ _tuning_optimized_storage_devices }}"

      # Best-effort immediate apply. Persistence comes from the udev
      # rule rendered above (60-io-scheduler.rules); this write only
      # avoids the reboot. Some devices (loop, virtual disks) reject
      # arbitrary scheduler writes and we'd rather not abort the role.
      - name: Set I/O scheduler immediately
        ansible.builtin.shell: |
            echo "{{ item.item.scheduler }}" > /sys/block/{{ item.item.name }}/queue/scheduler
        become: true
        register: _tuning_scheduler_result
        failed_when: false
        changed_when: _tuning_scheduler_result.rc == 0
        when:
            - not item.failed
            - item.item.scheduler not in (item.content | b64decode)
        loop: "{{ _tuning_current_scheduler.results }}"

      - name: Report I/O scheduler configuration status
        ansible.builtin.debug:
            msg: >-
                Device {{ item.item.name }}:
                {% if item.failed -%}
                Could not access scheduler settings{%- elif _tuning_scheduler_result.results[loop.index0].changed -%}
                Changed to {{ item.item.scheduler }}{%- else -%}
                Already using {{ item.item.scheduler }}{%- endif %}
        loop: "{{ _tuning_current_scheduler.results }}"
        loop_control:
            extended: true

- name: Verify I/O scheduler configuration
  block:
      - name: Read final I/O scheduler settings
        ansible.builtin.slurp:
            src: "/sys/block/{{ item.name }}/queue/scheduler"
        register: _tuning_final_scheduler
        failed_when: false
        loop: "{{ _tuning_optimized_storage_devices }}"

      # Warn instead of assert: like the immediate apply above this is
      # best-effort, a device may not offer the scheduler (e.g. no
      # mq-deadline on some virtual disks).
      - name: Warn when an I/O scheduler was not applied
        ansible.builtin.debug:
            msg: >-
                WARNING: I/O scheduler {{ item.item.scheduler }} is not active on
                {{ item.item.name }} ({{ (item.content | b64decode | trim) if not item.failed else 'unreadable' }})
        loop: "{{ _tuning_final_scheduler.results }}"
        loop_control:
            label: "{{ item.item.name }}"
        when:
            - not ansible_check_mode
            - item.failed or ('[' + item.item.scheduler + ']') not in (item.content | b64decode)
