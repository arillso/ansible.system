---
# File: roles/system_tuning/tasks/network.yml
# Advanced network performance tuning with validation

# Split into required vs optional sysctls so failure attribution is
# unambiguous in the loop. The previous combined task self-referenced
# `network_sysctl_result.failed` inside `failed_when`, which is
# dependent on ansible-core's per-iteration semantics and was brittle
# to refactor (and Audit M3). Required sysctls fail loudly; optional
# ones are tracked via a separate task that captures `ignore_errors`
# and reports a list of misses for the report task below.

- name: Configure required network sysctl parameters
  ansible.posix.sysctl:
      name: "{{ _net_sysctl_item.key }}"
      value: "{{ _net_sysctl_item.value }}"
      state: present
      reload: true
      sysctl_file: "{{ tuning_network_sysctl_file }}"
  become: true
  loop: "{{ tuning_network_sysctl_config | dict2items }}"
  loop_control:
      loop_var: _net_sysctl_item
      label: "{{ _net_sysctl_item.key }}"
  when: _net_sysctl_item.key not in (tuning_optional_network_sysctl_params | default([]))
  register: _tuning_network_sysctl_required

- name: Configure optional network sysctl parameters
  ansible.posix.sysctl:
      name: "{{ _net_sysctl_item.key }}"
      value: "{{ _net_sysctl_item.value }}"
      state: present
      reload: true
      sysctl_file: "{{ tuning_network_sysctl_file }}"
  become: true
  loop: "{{ tuning_network_sysctl_config | dict2items }}"
  loop_control:
      loop_var: _net_sysctl_item
      label: "{{ _net_sysctl_item.key }}"
  when: _net_sysctl_item.key in (tuning_optional_network_sysctl_params | default([]))
  register: _tuning_network_sysctl_optional
  ignore_errors: true

- name: Report optional sysctl parameters that could not be applied
  ansible.builtin.debug:
      msg: >-
          Optional sysctl '{{ _net_sysctl_item.item.key }}' could not be applied
          on this host: {{ _net_sysctl_item.msg | default('see previous error') }}
  loop: "{{ _tuning_network_sysctl_optional.results | default([]) }}"
  loop_control:
      loop_var: _net_sysctl_item
      label: "{{ _net_sysctl_item.item.key | default('(skipped)') }}"
  when:
      - _net_sysctl_item.failed | default(false)
      - not _net_sysctl_item.skipped | default(false)

- name: Remove optional network sysctl parameters that could not be applied
  ansible.posix.sysctl:
      name: "{{ _net_sysctl_item.item.key }}"
      state: absent
      reload: false
      sysctl_file: "{{ tuning_network_sysctl_file }}"
  become: true
  loop: "{{ _tuning_network_sysctl_optional.results | default([]) }}"
  loop_control:
      loop_var: _net_sysctl_item
      label: "{{ _net_sysctl_item.item.key | default('(skipped)') }}"
  when:
      - _net_sysctl_item.failed | default(false)
      - not _net_sysctl_item.skipped | default(false)

# net.ipv4.tcp_fack was removed in kernel 4.15. Earlier role versions wrote it
# into the drop-in, where it breaks `sysctl --system` on every newer kernel.
- name: Remove obsolete tcp_fack from the network sysctl file
  ansible.posix.sysctl:
      name: net.ipv4.tcp_fack
      state: absent
      reload: false
      sysctl_file: "{{ tuning_network_sysctl_file }}"
  become: true
  when: "'net.ipv4.tcp_fack' not in tuning_network_sysctl_config"

- name: Configure network ring buffers
  block:
      - name: Validate network interfaces exist
        ansible.builtin.stat:
            path: "/sys/class/net/{{ item.interface }}"
        register: _tuning_interface_check
        loop: "{{ tuning_network_ring_buffers }}"
        when: tuning_network_ring_buffers is defined and tuning_network_ring_buffers | length > 0

      - name: Filter valid interfaces
        ansible.builtin.set_fact:
            _tuning_valid_network_buffers: "{{ _tuning_valid_network_buffers | default([]) + [item.item] }}"
        loop: "{{ _tuning_interface_check.results }}"
        when:
            - _tuning_interface_check.results is defined
            - item.stat.exists

      - name: Get current ring buffer settings
        ansible.builtin.command: ethtool -g {{ item.interface }}
        register: _tuning_current_ring_buffers
        changed_when: false
        failed_when: false
        loop: "{{ _tuning_valid_network_buffers | default([]) }}"

      - name: Apply network ring buffer settings immediately
        ansible.builtin.command: >-
            ethtool -G {{ item.item.interface }}
            rx {{ item.item.rx_buffer }}
            tx {{ item.item.tx_buffer }}
        become: true
        register: _tuning_ethtool_result
        changed_when: _tuning_ethtool_result.rc == 0
        # Compare against the "Current hardware settings" section only; the
        # "Pre-set maximums" section above it would match the target too.
        vars:
            _tuning_ring_current: "{{ item.stdout.split('Current hardware settings:') | last }}"
        when:
            - item.rc == 0
            - >-
                (_tuning_ring_current | regex_findall('(?m)^RX:\\s+(\\d+)') | first | default(''))
                != (item.item.rx_buffer | string)
                or (_tuning_ring_current | regex_findall('(?m)^TX:\\s+(\\d+)') | first | default(''))
                != (item.item.tx_buffer | string)
        loop: "{{ _tuning_current_ring_buffers.results }}"

      - name: Report ring buffer configuration status
        ansible.builtin.debug:
            msg: >-
                Interface {{ item.item.interface }}:
                {% if item.rc != 0 -%}
                Could not read current settings{%- elif _tuning_ethtool_result.results[loop.index0].changed -%}
                Ring buffers updated (RX: {{ item.item.rx_buffer }}, TX: {{ item.item.tx_buffer }}){%- else -%}
                Ring buffers already optimal{%- endif %}
        loop: "{{ _tuning_current_ring_buffers.results }}"
        loop_control:
            extended: true
        when: _tuning_current_ring_buffers.results is defined

      - name: Create network tuning systemd service
        ansible.builtin.template:
            src: etc/systemd/system/network-tuning.service.j2
            dest: /etc/systemd/system/network-tuning.service
            mode: "0644"
            owner: root
            group: root
        become: true
        notify:
            - "tuning: reload systemd"
            - "tuning: apply network"
        when: _tuning_valid_network_buffers is defined and _tuning_valid_network_buffers | length > 0

- name: Verify network configuration
  block:
      - name: Test network sysctl parameters
        ansible.builtin.command: sysctl {{ item.key }}
        register: _tuning_sysctl_verify
        changed_when: false
        failed_when: false
        loop: "{{ tuning_network_sysctl_config | dict2items }}"

      - name: Report network sysctl verification
        ansible.builtin.debug:
            msg: >-
                Network parameter {{ item.item.key }}:
                {% if item.rc == 0 -%}
                {%- set current_value = item.stdout.split('=')[1].strip() -%}
                {%- if current_value == (item.item.value | string) -%}
                ✓ Correctly set to {{ item.item.value }}{%- else -%}
                ✗ Expected {{ item.item.value }}, got {{ current_value }}{%- endif -%}
                {%- else -%}
                ✗ Could not verify{%- endif %}
        loop: "{{ _tuning_sysctl_verify.results }}"
        when: not ansible_check_mode

      - name: Verify ring buffer settings
        ansible.builtin.command: ethtool -g {{ item.interface }}
        register: _tuning_verify_ring_buffers
        changed_when: false
        failed_when: false
        loop: "{{ _tuning_valid_network_buffers | default([]) }}"

      - name: Report ring buffer verification
        ansible.builtin.debug:
            msg: >-
                Interface {{ item.item.interface }} ring buffers:
                {% if item.rc == 0 -%}
                ✓ Configuration applied successfully{%- else -%}
                ✗ Could not verify ring buffer settings{%- endif %}
        loop: "{{ _tuning_verify_ring_buffers.results }}"
        when:
            - not ansible_check_mode
            - _tuning_verify_ring_buffers.results is defined
