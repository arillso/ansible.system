---
# sysctl configuration directory and parameter application

- name: Create sysctl configuration directory
  ansible.builtin.file:
      path: /etc/sysctl.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true

# bbr is a module on most distro kernels; without it the sysctl write is
# rejected. Best-effort: when the module is missing, the (default optional)
# congestion-control key is reported and skipped below.
- name: Load tcp_bbr for the bbr congestion control
  community.general.modprobe:
      name: tcp_bbr
      state: present
      persistent: present
  become: true
  failed_when: false
  when: _tuning_sysctl_effective['net.ipv4.tcp_congestion_control'] | default('') == 'bbr'

- name: Apply sysctl parameters
  ansible.builtin.include_tasks: sysctl_apply.yml
  vars:
      _tuning_apply_config: "{{ _tuning_sysctl_effective }}"
      _tuning_apply_optional: "{{ tuning_optional_sysctl_params | default([]) }}"
      _tuning_apply_file: "{{ tuning_sysctl_file }}"
