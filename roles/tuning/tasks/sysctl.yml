---
# sysctl configuration directory and parameter application

- name: Create sysctl configuration directory
  ansible.builtin.file:
      path: /etc/sysctl.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true

# Sysctls are split into required vs optional so failure attribution
# is unambiguous in the loop. The previous single task self-referenced
# `sysctl_result.failed` from inside `failed_when`, which is the same
# Audit M3 anti-pattern that was fixed in network.yml.

- name: Configure required sysctl parameters
  ansible.posix.sysctl:
      name: "{{ _sysctl_item.key }}"
      value: "{{ _sysctl_item.value }}"
      state: present
      reload: true
      sysctl_file: "{{ tuning_sysctl_file }}"
  become: true
  loop: "{{ tuning_sysctl_config | dict2items }}"
  loop_control:
      loop_var: _sysctl_item
      label: "{{ _sysctl_item.key }}"
  when: _sysctl_item.key not in (tuning_optional_sysctl_params | default([]))
  notify: "tuning: reload sysctl"
  register: _tuning_sysctl_required

- name: Configure optional sysctl parameters
  ansible.posix.sysctl:
      name: "{{ _sysctl_item.key }}"
      value: "{{ _sysctl_item.value }}"
      state: present
      reload: true
      sysctl_file: "{{ tuning_sysctl_file }}"
  become: true
  loop: "{{ tuning_sysctl_config | dict2items }}"
  loop_control:
      loop_var: _sysctl_item
      label: "{{ _sysctl_item.key }}"
  when: _sysctl_item.key in (tuning_optional_sysctl_params | default([]))
  notify: "tuning: reload sysctl"
  register: _tuning_sysctl_optional
  ignore_errors: true

- name: Report optional sysctl parameters that could not be applied
  ansible.builtin.debug:
      msg: >-
          Optional sysctl '{{ _sysctl_item.item.key }}' could not be applied
          on this host: {{ _sysctl_item.msg | default('see previous error') }}
  loop: "{{ _tuning_sysctl_optional.results | default([]) }}"
  loop_control:
      loop_var: _sysctl_item
      label: "{{ _sysctl_item.item.key | default('(skipped)') }}"
  when:
      - _sysctl_item.failed | default(false)
      - not _sysctl_item.skipped | default(false)
