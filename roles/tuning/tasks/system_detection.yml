---
# File: roles/system_tuning/tasks/system_detection.yml
# Simple auto-detect system capabilities

- name: Gather additional hardware facts
  ansible.builtin.setup:
      gather_subset:
          - hardware
          - network
      filter:
          - ansible_processor*
          - ansible_devices
          - ansible_interfaces

- name: Detect CPU information using facts
  ansible.builtin.set_fact:
      _tuning_detected_cpu_vendor: >-
          {%- if 'Intel' in ansible_facts['processor'][1] -%}
          intel{%- elif 'AMD' in ansible_facts['processor'][1] -%}
          amd{%- else -%}
          unknown{%- endif -%}

- name: Check if CPU frequency scaling is supported
  ansible.builtin.stat:
      path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
  register: _tuning_cpufreq_check

- name: Read available CPU governors
  ansible.builtin.slurp:
      src: /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
  register: _tuning_cpufreq_governors
  when: _tuning_cpufreq_check.stat.exists

- name: Set detected CPU info
  ansible.builtin.set_fact:
      _tuning_detected_cpu_info:
          vendor: "{{ _tuning_detected_cpu_vendor }}"
          model: "{{ ansible_facts['processor'][1] }}"
          cpufreq_supported: "{{ _tuning_cpufreq_check.stat.exists }}"
          governors: >-
              {{ (_tuning_cpufreq_governors.content | b64decode).split()
                 if _tuning_cpufreq_check.stat.exists else [] }}

- name: Detect storage devices using facts
  ansible.builtin.set_fact:
      _tuning_detected_storage_devices: >-
          {{
            ansible_facts['devices']
            | dict2items
            | selectattr('value.type', 'defined')
            | selectattr('value.type', 'equalto', 'disk')
            | selectattr('value.removable', 'defined')
            | selectattr('value.removable', 'equalto', '0')
            | list
          }}

- name: Detect network interfaces using facts
  ansible.builtin.set_fact:
      _tuning_detected_network_interfaces: >-
          {{
            ansible_facts['interfaces']
            | difference(['lo'])
            | reject('match', '^(docker|br-|veth|virbr).*')
            | reject('contains', '@')
            | list
          }}

- name: Set optimal settings
  ansible.builtin.set_fact:
      # CPU governor: override > tuning_cpu_governor > auto. auto takes the
      # first governor the driver offers (amd-pstate and intel_pstate only
      # have performance and powersave).
      _tuning_final_cpu_governor: >-
          {%- set avail = _tuning_detected_cpu_info.governors -%}
          {%- set wanted = tuning_cpu_governor_override
                or (tuning_cpu_governor if tuning_cpu_governor | default('auto') != 'auto' else '') -%}
          {%- if not _tuning_detected_cpu_info.cpufreq_supported -%}
          none{%- elif wanted -%}
          {{ wanted }}{%- else -%}
          {{ ((['powersave' if _tuning_detected_cpu_info.vendor == 'intel' else 'ondemand', 'schedutil', 'powersave']
               | select('in', avail) | list) + avail) | first }}{%- endif -%}

      # Storage: override > tuning_io_scheduler > auto (nvme -> none, else
      # mq-deadline). tuning_io_scheduler_devices replaces the detected disks;
      # its entries are udev KERNEL patterns, so md*, dm-* or sd[a-z] work.
      _tuning_optimized_storage_devices: >-
          {%- set devices = [] -%}
          {%- set fixed = tuning_io_scheduler_override
                or (tuning_io_scheduler if tuning_io_scheduler | default('auto') != 'auto' else '') -%}
          {%- for name in (tuning_io_scheduler_devices | default([], true)
                or _tuning_detected_storage_devices | map(attribute='key') | list) -%}
          {%- set scheduler = fixed or ('none' if 'nvme' in name else 'mq-deadline') -%}
          {%- set _ = devices.append({'name': name, 'scheduler': scheduler}) -%}
          {%- endfor -%}
          {{ devices }}

- name: Assert the CPU governor is offered by the cpufreq driver
  ansible.builtin.assert:
      that: _tuning_final_cpu_governor in _tuning_detected_cpu_info.governors
      fail_msg: >-
          CPU governor '{{ _tuning_final_cpu_governor }}' is not available.
          Available: {{ _tuning_detected_cpu_info.governors | join(', ') }}
      quiet: true
  when: _tuning_detected_cpu_info.cpufreq_supported | bool
