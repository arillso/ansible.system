---
# Transparent huge pages

- name: Configure transparent huge pages
  block:
      # Best-effort immediate apply: containers and minimal kernels can
      # have transparent_hugepage disabled at compile time (sysfs entry
      # missing) or read-only. The disable-thp.service rendered below is
      # the persistent path of record — failing here would prevent the
      # systemd unit from being deployed on hosts that just happen not
      # to expose the sysfs knob. `tee` writes in place; `copy` cannot,
      # its temp-file-and-rename fails on sysfs.
      - name: Read current transparent huge pages setting
        ansible.builtin.slurp:
            src: /sys/kernel/mm/transparent_hugepage/enabled
        register: _tuning_thp_current
        failed_when: false

      - name: Set transparent huge pages immediately
        ansible.builtin.command: tee /sys/kernel/mm/transparent_hugepage/enabled
        args:
            stdin: "{{ tuning_transparent_hugepages }}"
        become: true
        register: _tuning_thp_result
        changed_when: _tuning_thp_result.rc == 0
        failed_when: false
        when:
            - _tuning_thp_current.content is defined
            - ('[' ~ tuning_transparent_hugepages ~ ']') not in (_tuning_thp_current.content | b64decode)

      - name: Create systemd service for transparent huge pages
        ansible.builtin.template:
            src: etc/systemd/system/disable-thp.service.j2
            dest: /etc/systemd/system/disable-thp.service
            mode: "0644"
            owner: root
            group: root
        become: true
        notify:
            - "tuning: reload systemd"
            - "tuning: apply thp"
        # Without the sysfs knob the unit's ExecStartPost check would fail.
        when: _tuning_thp_current.content is defined
