---
# tuned profile management

- name: Apply tuned profile
  when:
      - tuning_tuned_profile is defined
      - not ansible_check_mode
  block:
      - name: Start and enable tuned service via systemd role
        ansible.builtin.include_role:
            name: arillso.system.systemd
            tasks_from: service
        vars:
            systemd_services:
                - name: tuned
                  state: started
                  enabled: true

      - name: Get available tuned profiles
        ansible.builtin.command: tuned-adm list
        register: _tuning_available_tuned_profiles
        changed_when: false

      - name: Validate tuned profile
        ansible.builtin.fail:
            msg: >-
                Tuned profile '{{ tuning_tuned_profile }}' is not available.
                Available profiles: {{ _tuning_available_tuned_profiles.stdout }}
        when: tuning_tuned_profile not in _tuning_available_tuned_profiles.stdout

      - name: Get current tuned profile
        ansible.builtin.command: tuned-adm active
        register: _tuning_current_tuned_profile
        changed_when: false

      - name: Set tuned profile
        ansible.builtin.command: tuned-adm profile {{ tuning_tuned_profile }}
        become: true
        when:
            - tuning_tuned_profile is defined
            - tuning_tuned_profile not in _tuning_current_tuned_profile.stdout
        changed_when: true
        register: _tuning_tuned_result
        failed_when: _tuning_tuned_result.rc != 0
