---
# OS-specific variables for tuning role
_tuning_packages:
    Debian:
        - sysstat
        - iotop
        - htop
        - tuned
        - cpufrequtils
        - ethtool
        - util-linux # For lscpu, lsblk
        - pciutils # For lspci
    RedHat:
        - sysstat
        - iotop
        - htop
        - tuned
        - tuned-utils
        - ethtool
        - util-linux # For lscpu, lsblk
        - pciutils # For lspci
    Suse:
        - sysstat
        - iotop
        - htop
        - tuned
        - ethtool
        - util-linux
        - pciutils

# GRUB update commands per OS family
_tuning_grub_update_commands:
    Debian: "update-grub"
    RedHat: "grub2-mkconfig -o /boot/grub2/grub.cfg"
    Suse: "grub2-mkconfig -o /boot/grub2/grub.cfg"

# CPU frequency service and the package that ships it, per OS family
_tuning_service_commands:
    Debian:
        cpufreq: "cpufrequtils"
        cpufreq_package: "cpufrequtils"
    RedHat:
        cpufreq: "cpupower"
        cpufreq_package: "kernel-tools"
    Suse:
        cpufreq: "cpupower"
        cpufreq_package: "cpupower"

# Effective sysctls: tuning_swap_swappiness owns vm.swappiness, so it is
# written once instead of by two tasks into the same file.
_tuning_sysctl_effective: >-
    {{ tuning_sysctl_config
       | combine({'vm.swappiness': tuning_swap_swappiness}
                 if tuning_swap_swappiness is defined else {}) }}
