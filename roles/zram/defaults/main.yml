---
# Compressed RAM swap (zram) defaults
#
# zram_enabled: master switch for the role. Default true configures zram;
# false disables an existing zramswap.service without stopping it (no
# swapoff), so zram is gone after the next reboot, and skips everything else.
zram_enabled: true

# zram_percent: percentage (1..100) of physical RAM to allocate as zram swap device.
# Default 50 means a 16 GB host gets an 8 GB zram device. With typical
# zstd compression ratios on JS/TS/text workloads (~3x), this yields
# ~24 GB of effectively usable memory.
zram_percent: 50

# zram_algorithm: kernel compression algorithm. zstd is the best balance
# of speed and compression ratio on modern kernels. Available algorithms
# are validated against /sys/block/zram0/comp_algorithm at role runtime.
zram_algorithm: zstd

# zram_priority: Linux swap priority for the zram device (0..32767). Higher than
# any disk-based swap so the kernel fills zram first. The role's tuning
# expects this to remain >= disk swap priorities (typically tuning_swap_priority).
zram_priority: 100

# zram_packages: distro packages to install. zram-tools ships a deployable
# /etc/default/zramswap config and a zramswap.service systemd unit.
zram_packages:
    - zram-tools

# zram_kernel_module_package: package that provides the zram kernel module
# for the running kernel. On Ubuntu cloud images with linux-image-virtual the
# module is not part of the base image — it lives in
# linux-modules-extra-<kernel>. The role installs it only when `modinfo zram`
# fails, so built-in modules and custom kernels need no package. Debian ships the module in the stock kernel and has
# no linux-modules-extra-* package, so the default is empty there and the
# install step is skipped. Set explicitly to override per host.
zram_kernel_module_package: >-
    {{ 'linux-modules-extra-' ~ ansible_facts['kernel']
       if ansible_facts['distribution'] == 'Ubuntu' else '' }}

# zram_kernel_module_meta_package: optional flavour metapackage installed
# next to zram_kernel_module_package, so a kernel upgrade also pulls the
# matching linux-modules-extra. Empty by default: zram_kernel_module_package
# only covers the running kernel, so after a kernel upgrade the role must run
# again before zram works. Ubuntu examples: linux-image-extra-virtual (generic,
# also pulls linux-image-generic, linux-firmware and microcode),
# linux-image-extra-virtual-hwe-<release> on HWE hosts,
# linux-modules-extra-<flavour> for cloud kernels such as aws, azure or gcp.
zram_kernel_module_meta_package: ""

# zram_restart_on_change: restart zramswap on a config change even while zram
# swap holds data. The restart runs swapoff, which pulls every page back into
# RAM and can stall the host. Default false restarts only an empty zram swap
# and otherwise leaves the new config for the next reboot.
zram_restart_on_change: false
