---
argument_specs:
    main:
        short_description: "Configure compressed RAM swap (zram) on Linux systems"
        description:
            - "Installs the zram-tools package and the kernel module that provides zram"
            - "Validates the requested compression algorithm against kernel capabilities"
            - "Deploys /etc/default/zramswap and enables the zramswap service"
            - "Arillso"
        options:
            zram_enabled:
                description: "Enable or disable zram; false disables an existing zramswap.service; zram stays active until the next reboot"
                type: "bool"
                required: false
                default: true

            zram_percent:
                description:
                    - "Percentage of physical RAM to allocate as the zram swap device"
                    - "50 means a 16 GB host gets an 8 GB zram device"
                    - "Must be 1..100"
                type: "int"
                required: false
                default: 50

            zram_algorithm:
                description:
                    - "Kernel compression algorithm for the zram device"
                    - "Validated at runtime against /sys/block/zram0/comp_algorithm"
                type: "str"
                required: false
                default: "zstd"

            zram_priority:
                description:
                    - "Linux swap priority for the zram device (higher wins)"
                    - "Should be greater than any disk-based swap priority so the kernel fills zram first"
                    - "Must be 0..32767"
                type: "int"
                required: false
                default: 100

            zram_packages:
                description: "Distribution packages to install that provide zram userspace tooling"
                type: "list"
                elements: "str"
                required: false
                default:
                    - "zram-tools"

            zram_kernel_module_package:
                description:
                    - "Package that provides the zram kernel module; empty value skips the install"
                    - "On Ubuntu, resolved at runtime to linux-modules-extra-<kernel> for the running kernel"
                    - "Installed only when modinfo zram fails or the package is already installed"
                    - "Empty on Debian, which ships the zram module in the stock kernel with no separate package"
                type: "str"
                required: false

            zram_kernel_module_meta_package:
                description:
                    - "Flavour metapackage installed with zram_kernel_module_package so kernel upgrades pull the matching module"
                    - "Empty by default; without it the role must run again after a kernel upgrade"
                    - "Examples: linux-image-extra-virtual, linux-image-extra-virtual-hwe-<release>, linux-modules-extra-aws"
                type: "str"
                required: false
                default: ""

            zram_restart_on_change:
                description:
                    - "Restart zramswap on a config change even while zram swap holds data"
                    - "false restarts only an empty zram swap and leaves the new config for the next reboot"
                type: "bool"
                required: false
                default: false
