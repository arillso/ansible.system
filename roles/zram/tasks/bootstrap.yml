---
- name: Cache update via packages role
  ansible.builtin.include_role:
      name: arillso.system.packages
      tasks_from: cache
  vars:
      packages_cache_valid_time: 3600

# Built-in modules, Debian stock kernels and custom kernels already provide
# zram; a guessed linux-modules-extra-<kernel> name does not exist there.
- name: Probe whether the zram kernel module is available
  ansible.builtin.command:
      cmd: modinfo -n zram
  register: _zram_modinfo
  changed_when: false
  failed_when: false
  check_mode: false

# The running-kernel package only when the module is missing or already comes
# from it; the opt-in metapackage whenever it is set. ansible_facts.packages
# comes from package_facts in preflight.yml.
- name: Install kernel module packages providing zram
  ansible.builtin.include_role:
      name: arillso.system.packages
      tasks_from: packages
  vars:
      _zram_kernel_packages: >-
          {{ ([zram_kernel_module_package]
              if zram_kernel_module_package | length > 0
                 and (_zram_modinfo.rc != 0
                      or zram_kernel_module_package in ansible_facts.packages)
              else [])
             + ([zram_kernel_module_meta_package]
                if zram_kernel_module_meta_package | length > 0 else []) }}
      packages_list: >-
          {{ _zram_kernel_packages
             | map('community.general.dict_kv', 'name')
             | map('combine', {'state': 'present'})
             | list }}
  when: _zram_kernel_packages | length > 0

# num_devices=1 is the kernel default, but stating it explicitly guarantees
# /sys/block/zram0 exists for the algorithm validation in validate.yml — a host
# with `options zram num_devices=0` in /etc/modprobe.d/ would otherwise leave no
# device node and fail the slurp with an opaque "file not found".
- name: Load zram kernel module
  community.general.modprobe:
      name: zram
      params: num_devices=1
      state: present
  become: true
