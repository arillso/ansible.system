---
# Only read under --check: there the package install is simulated, so a fresh
# host has no unit yet and systemd would fail on the unknown service. The
# disabled path and the restart handler use the same result.
- name: Probe whether zramswap.service is installed
  ansible.builtin.command:
      cmd: systemctl list-unit-files --no-legend zramswap.service
  register: _zram_unit
  changed_when: false
  failed_when: false
  check_mode: false

# zram_enabled: false disables zramswap but does not stop it: stopping runs
# swapoff, which fails or stalls the host when the pages held in zram do not
# fit back into RAM. zram stays active until the next reboot.
- name: Disable zramswap when the role is disabled
  ansible.builtin.systemd:
      name: zramswap
      enabled: false
  become: true
  register: _zram_disabled
  when:
      - not zram_enabled | bool
      - _zram_unit.stdout | length > 0

- name: Report that zram stays active until the next reboot
  ansible.builtin.debug:
      msg: >-
          zramswap.service is disabled. zram swap stays active until the next
          reboot; run `systemctl stop zramswap` once enough RAM is free to
          switch it off now.
  when: _zram_disabled is changed

- name: End the role when zram is disabled
  ansible.builtin.meta: end_role
  when: not zram_enabled | bool

- name: Check zram variables and competing zram setups
  ansible.builtin.include_tasks: preflight.yml

- name: Bootstrap zram kernel module on host
  ansible.builtin.include_tasks: bootstrap.yml

- name: Validate zram configuration against kernel capabilities
  ansible.builtin.include_tasks: validate.yml
  # Skipped in check mode: the module is not actually loaded under --check,
  # so /sys/block/zram0/comp_algorithm may not exist and the slurp would fail.
  when: not ansible_check_mode

# Deployed before zram-tools is installed: the package's postinst starts
# zramswap, and apt keeps an existing conffile (force-confold), so a fresh
# host comes up with these settings instead of the package defaults. The
# restart handler skips a zram swap that already holds data, which on a fresh
# host is likely by the time handlers run.
- name: Deploy zramswap configuration
  ansible.builtin.template:
      src: etc/default/zramswap.j2
      dest: /etc/default/zramswap
      owner: root
      group: root
      mode: "0644"
  become: true
  notify: "zram: restart zramswap"

- name: Install zram tools package via packages role
  ansible.builtin.include_role:
      name: arillso.system.packages
      tasks_from: packages
  vars:
      packages_list: >-
          {{ zram_packages
             | map('community.general.dict_kv', 'name')
             | map('combine', {'state': 'present'})
             | list }}

- name: Manage zramswap service via systemd role
  ansible.builtin.include_role:
      name: arillso.system.systemd
      tasks_from: service
  vars:
      systemd_services:
          - name: zramswap
            enabled: true
            state: started
            daemon_reload: true
  when: not ansible_check_mode or _zram_unit.stdout | length > 0
